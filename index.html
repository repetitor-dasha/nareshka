/* ---------- Тренажёр ---------- */
let session = null;
let advanceTimer = null;

// Подсвечивает заглавную ударную гласную цветом.
function stressedText(text) {
  const out = [];
  let buffer = '';
  for (const ch of text) {
    if (isStressed(ch)) {
      if (buffer) out.push(buffer);
      buffer = '';
      out.push(h('span', { class: 'stress', text: ch }));
    } else buffer += ch;
  }
  if (buffer) out.push(buffer);
  return out;
}

function buildQuestion(card) {
  if (!card.word) {
    return {
      label: { use: 'Какой пароним подходит?', cut: 'Какое слово лишнее?', swap: 'Какое слово заменить и на какое?', form: 'Как правильно?', multi: 'Выберите все верные варианты', rule: 'Вспомните правило', pick: 'Выберите слово', gap: card.q.split('..').length > 2 ? 'Какие буквы пропущены?' : 'Какая буква пропущена?' }[card.kind] || 'Выберите верный вариант',
      big: card.kind === 'gap',
      prompt: card.q,
      def: card.def,
      hits: card.hits,
      multi: card.kind === 'multi',
      options: shuffle(card.options),
      answers: answersOf(card),
      hint: card.hint,
      explain: card.explain,
      isAccent: false
    };
  }
  const chars = [...card.word];
  const base = chars.map(c => c.toLowerCase().replace('ё', 'е'));
  const vowels = chars.map((c, i) => (isVowel(c) ? i : -1)).filter(i => i >= 0);
  const stress = chars.findIndex(isStressed);
  // Берём ближайшие к ударной гласные: длинное слово не должно давать больше четырёх вариантов.
  const others = vowels.filter(i => i !== stress).sort((a, b) => Math.abs(a - stress) - Math.abs(b - stress)).slice(0, 3);
  const variants = others.map(i => base.map((c, j) => (j === i ? c.toUpperCase() : c)).join(''));
  return {
    label: 'Где ударение?',
    prompt: base.join(''),
    note: card.note,
    options: shuffle([card.word, ...variants]),
    answers: [card.word],
    hint: card.hint,
    isAccent: true
  };
}

function startSession(mod, partId) {
  clearTimeout(advanceTimer);
  const allParts = partsOf(mod);
  const chosen = partId === 'all' ? null : String(partId).split('-').map(Number).map(i => allParts[i]).filter(Boolean);
  const names = chosen ? new Set(chosen.map(p => p.name)) : null;
  const cards = names ? mod.cards.filter(c => names.has(c.part || 'Другое')) : mod.cards;
  if (!cards.length) { renderTask(mod); return; }
  session = {
    mod,
    partId,
    partName: !chosen ? '' : chosen.length === 1 ? chosen[0].name : `${chosen.length} ${plural(chosen.length, 'раздел', 'раздела', 'разделов')}`,
    total: cards.length,
    queue: shuffle(cards),
    index: 0,
    round: 1,
    wrong: [],
    mastered: new Set(),
    question: null,
    answered: false
  };
  showCard();
}

const sessionBack = () => (session.mod.virtual ? '' : partsOf(session.mod).length > 1 ? 'task-' + session.mod.id : backOf(session.mod));
const sessionTitle = () => (session.mod.virtual ? session.mod.title : moduleName(session.mod)) + (session.partName ? ' · ' + session.partName : '');

const percent = () => Math.round(session.mastered.size / session.total * 100);

function progressBlock(left) {
  return h('div', {},
    h('div', { class: 'progress-row' }, h('span', { text: left }), h('span', { id: 'percent', text: percent() + '%' })),
    h('div', { class: 'progress', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': percent(), 'aria-label': 'Прогресс' },
      h('i', { id: 'bar', style: `width:${percent()}%` })
    )
  );
}

function studyBar() {
  return h('div', { class: 'study-bar' },
    h('button', { class: 'btn', type: 'button', text: '← К заданиям', onclick: () => go(sessionBack()) }),
    h('button', { class: 'btn', type: 'button', text: 'Начать заново', onclick: () => startSession(session.mod, session.partId) })
  );
}

function showCard() {
  const s = session;
  s.answered = false;
  s.question = buildQuestion(s.queue[s.index]);
  const q = s.question;

  s.picked = new Set();
  const options = q.options.map((opt, i) => h('button', {
    class: 'option', type: 'button', 'data-value': opt, 'aria-pressed': q.multi ? 'false' : null, onclick: () => (q.multi ? togglePick(opt) : answer(opt))
  },
    h('span', { class: 'key', 'aria-hidden': 'true', text: i + 1 }),
    h('span', { class: 'txt' }, q.isAccent ? stressedText(opt) : opt),
    h('span', { class: 'mark', 'aria-hidden': 'true' })
  ));
  const compact = q.options.every(o => o.length <= 14);

  app.replaceChildren(h('section', { class: 'study' },
    studyBar(),
    h('div', { class: 'study-title', text: sessionTitle() }),
    progressBlock(`Круг ${s.round} · карточка ${s.index + 1} из ${s.queue.length}`),
    h('article', { class: 'card' },
      h('div', {},
        h('p', { class: 'card-label', text: q.label }),
        q.def && h('p', { class: 'def', text: 'Значение: ' + q.def }),
        h('p', { class: 'prompt' + (q.isAccent || q.big ? ' word' : '') + (q.prompt.length > 16 ? ' long' : ''), text: q.prompt }),
        q.note && h('p', { class: 'note', text: q.note })
      ),
      h('div', { class: 'options' + (compact && !q.multi ? ' two' : ''), id: 'options' }, options),
      q.multi && h('button', { class: 'btn primary', id: 'check', type: 'button', disabled: true, text: 'Проверить', onclick: () => answer(null) }),
      h('div', { class: 'feedback', id: 'feedback', 'aria-live': 'polite' })
    )
  ));
  window.scrollTo(0, 0);
}

// «[двойная] порция» → «двойная порция» с выделенным словом.
function usage(text) {
  const m = text.match(/^(.*)\[([^\]]+)\](.*)$/);
  return m ? [m[1], h('b', { text: m[2] }), m[3]] : [text];
}

function explainPanel(q) {
  return h('div', { class: 'explain' }, q.explain.map(item => h('div', { class: 'ex-word' + ((q.hits || q.answers).includes(item.w) ? ' hit' : '') },
    h('span', { class: 'ex-title', text: item.w }),
    item.m.map(m => [
      h('span', { class: 'ex-mean', text: m.d }),
      h('span', { class: 'ex-use' }, m.ex.flatMap((e, i) => (i ? [', ', ...usage(e)] : usage(e))))
    ])
  )));
}

function togglePick(opt) {
  const s = session;
  if (!s || s.answered) return;
  if (s.picked.has(opt)) s.picked.delete(opt); else s.picked.add(opt);
  document.querySelectorAll('#options .option').forEach(btn => {
    const on = s.picked.has(btn.dataset.value);
    btn.classList.toggle('picked', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  const check = document.getElementById('check');
  if (check) check.disabled = !s.picked.size;
}

function answer(choice) {
  const s = session;
  if (!s || s.answered) return;
  s.answered = true;
  const q = s.question;
  const ok = q.multi ? (s.picked.size === q.answers.length && q.answers.every(a => s.picked.has(a))) : q.answers.includes(choice);
  const card = s.queue[s.index];
  if (ok) s.mastered.add(cardKey(card)); else s.wrong.push(card);
  if (window.trackAnswer) window.trackAnswer(s, card, ok);

  document.querySelectorAll('#options .option').forEach(btn => {
    const value = btn.dataset.value;
    btn.disabled = true;
    const picked = q.multi ? s.picked.has(value) : value === choice;
    btn.classList.remove('picked');
    if (q.answers.includes(value)) {
      btn.classList.add('correct');
      if (q.multi && !picked) btn.classList.add('missed');
      btn.querySelector('.mark').textContent = '✓';
    } else if (picked) { btn.classList.add('wrong'); btn.querySelector('.mark').textContent = '✕'; }
    else btn.classList.add('faded');
  });
  document.getElementById('bar').style.width = percent() + '%';
  document.getElementById('percent').textContent = percent() + '%';

  const feedback = document.getElementById('feedback');
  const others = q.multi ? [] : q.answers.filter(a => a !== choice);
  const check = document.getElementById('check');
  if (check) check.remove();
  if (ok) {
    feedback.append(h('p', { class: 'verdict ok', text: 'Верно' }));
    if (others.length) feedback.append(h('p', { class: 'verdict ok', text: 'Также подходит: ' + others.join(', ') }));
  } else {
    feedback.append(q.multi
      ? h('p', { class: 'verdict bad', text: 'Не совсем. Все верные варианты отмечены зелёным, пропущенные — пунктиром.' })
      : h('p', { class: 'verdict bad' }, 'Ошибка. Правильно: ', q.isAccent ? stressedText(q.answers[0]) : q.answers.join(', ')));
  }
  if (q.hint) feedback.append(h('p', { class: 'hint', text: q.hint }));
  if (q.explain) feedback.append(explainPanel(q));

  if (ok && !q.hint && !q.explain) {
    advanceTimer = setTimeout(nextCard, 750);
  } else {
    const next = h('button', { class: 'btn primary', id: 'next', type: 'button', text: 'Дальше', onclick: nextCard });
    feedback.append(next);
    next.focus({ preventScroll: true });
  }
}

function nextCard() {
  clearTimeout(advanceTimer);
  const s = session;
  if (!s) return;
  s.index++;
  if (s.index < s.queue.length) showCard(); else showResults();
}

function startRetry() {
  const s = session;
  s.queue = shuffle(s.wrong);
  s.wrong = [];
  s.index = 0;
  s.round++;
  showCard();
}

function showResults() {
  if (window.flushTrack) window.flushTrack();
  const s = session;
  s.question = null;
  const inRound = s.queue.length;
  const right = inRound - s.wrong.length;
  const done = s.wrong.length === 0;
  const items = s.wrong.map(c => h('li', {},
    c.word ? h('span', { class: 'a' }, stressedText(c.word)) : h('span', { class: 'q', text: c.q }),
    !c.word && h('span', { class: 'a', text: answersOf(c).join('; ') })
  ));

  app.replaceChildren(h('section', { class: 'study' },
    studyBar(),
    h('div', { class: 'study-title', text: sessionTitle() }),
    h('article', { class: 'card' },
      h('div', {},
        h('p', { class: 'card-label', text: `Круг ${s.round} завершён` }),
        h('p', { class: 'score' + (done ? ' done' : ''), text: percent() + '%' }),
        h('p', { class: 'result-sub', text: done
          ? `Все карточки пройдены: ${cardsWord(s.total)}, кругов: ${s.round}.`
          : `В этом круге верно ${right} из ${inRound}. Осталось исправить: ${s.wrong.length}.` })
      ),
      !done && h('ul', { class: 'mistakes', 'aria-label': 'Ошибки этого круга' }, items),
      h('div', { class: 'result-actions' },
        done
          ? h('button', { class: 'btn primary', id: 'next', type: 'button', text: '← К заданиям', onclick: () => go(sessionBack()) })
          : h('button', { class: 'btn primary', id: 'next', type: 'button', text: `Повторить ошибки (${s.wrong.length})`, onclick: startRetry })
      )
    )
  ));
  document.getElementById('next').focus();
}

document.addEventListener('keydown', e => {
  if (!session || !session.question || modal.open || e.ctrlKey || e.metaKey || e.altKey) return;
  if (!session.answered && /^[1-9]$/.test(e.key)) {
    const opt = session.question.options[Number(e.key) - 1];
    if (opt) { if (session.question.multi) togglePick(opt); else answer(opt); }
  } else if (!session.answered && session.question.multi && e.key === 'Enter' && session.picked.size) {
    e.preventDefault();
    answer(null);
  } else if (session.answered && e.key === 'Enter' && !document.getElementById('next')) {
    nextCard();
  }
});

/* ---------- Навигация ---------- */
function route() {
  clearTimeout(advanceTimer);
  const hash = location.hash.slice(1);
  if (hash === 'admin') {
    setAdmin(true);
    location.hash = 'exam-ege';
    return;
  }
  session = null;
  if (window.extraRoute && window.extraRoute(hash)) { window.scrollTo(0, 0); return; }
  const study = hash.match(/^study-([a-z0-9]+)-(all|\d+(?:-\d+)*)$/);
  const task = hash.match(/^task-([a-z0-9]+)$/);
  const exam = EXAMS.find(e => hash === 'exam-' + e.id);
  const secM = hash.match(/^sec-([a-z]+)-([a-z0-9]+)$/);
  const secExam = secM && EXAMS.find(e => e.id === secM[1]);
  const sec = secExam && (secExam.sections || []).find(s => s.id === secM[2]);
  const byId = id => state.modules.find(m => m.id === id);
  if (study && byId(study[1]) && byId(study[1]).cards.length) startSession(byId(study[1]), study[2]);
  else if (task && byId(task[1])) renderTask(byId(task[1]));
  else if (exam) renderExam(exam);
  else if (sec) renderSection(secExam, sec);
  else renderHome();
  window.scrollTo(0, 0);
}

function go(hash) {
  if (location.hash.slice(1) === hash) route();
  else location.hash = hash;
}

window.addEventListener('hashchange', route);
window.addEventListener('storage', e => {
  if (e.key !== STORE_KEY) return;
  loadState();
  if (!session) route();
});

loadState();
route();
if (window.afterStart) window.afterStart();
</script>
