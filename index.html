sc":"Слитно или раздельно НЕ с разными частями речи; когда пишется НЕ, а когда НИ","exam":"oge","section":"orf","type":"quiz","cards":[{"kind":"rule","part":"От чего зависит написание","q":"НЕ с существительным, прилагательным и наречием на -О: от чего зависит написание?","options":["можно ли заменить слово синонимом без НЕ и есть ли противопоставление с А","от ударения","от рода слова","всегда раздельно"],"answer":"можно ли заменить слово синонимом без НЕ и есть ли противопоставление с А","hint":"Слитно, если можно подобрать синоним без НЕ: неинтересный = скучный, невысоко = низко; или слово без НЕ не употребляется: неряшливый. Раздельно, если есть противопоставление с союзом А (не счастье, а горе) или слова «вовсе, отнюдь, далеко, ничуть» (вовсе не старый). Союз НО и слова «очень, совершенно, крайне» слитному написанию не мешают: неширокая, но бурная; совершенно неизвестный.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"НЕ с глаголами и деепричастиями: от чего зависит написание?","options":["употребляется ли слово без НЕ","от синонима без НЕ","от противопоставления с А"],"answer":"употребляется ли слово без НЕ","hint":"Обычно раздельно: не знать, не думая, не смей. Слитно, только если без НЕ слово не употребляется: ненавидеть, негодовать, недоумевать, негодуя. Не путать: несмотря на (предлог, слитно) и не смотря (деепричастие, раздельно).","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"НЕ с полным причастием: от чего зависит написание?","options":["есть ли у причастия зависимые слова","от ударения","от синонима без НЕ"],"answer":"есть ли у причастия зависимые слова","hint":"Без зависимых слов — слитно: непрочитанная книга. С зависимым словом — раздельно: не прочитанная мной книга, ещё не исследованная местность.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"НЕ с кратким причастием и с числительным: от чего зависит написание?","options":["ни от чего: всегда раздельно","от синонима без НЕ","от зависимых слов"],"answer":"ни от чего: всегда раздельно","hint":"Краткие причастия: план не выполнен, задача не решена. Числительные: не пять, не первый, не трое.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"НЕДО- в глаголах: от чего зависит слитное или раздельное написание?","options":["от значения: «меньше нормы» или «не закончено»","от ударения","ни от чего"],"answer":"от значения: «меньше нормы» или «не закончено»","hint":"«Меньше нормы» (можно заменить на ПЕРЕ-) — слитно: недоварить (переварить), недосыпать. «Действие не доведено до конца» — раздельно: не дочитал книгу до конца.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"НЕ или НИ в местоимениях и наречиях (некого, никого): от чего зависит выбор?","options":["от ударения","от рода","от падежа"],"answer":"от ударения","hint":"Под ударением НЕ: нЕкого, нЕчего, нЕгде. Без ударения НИ: никогО, ничегО, нигдЕ. С предлогом пишем раздельно: не у кого, ни о чём.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Частица НИ в предложении: от чего зависит её употребление?","options":["от значения: усиление отрицания, уступка, устойчивое выражение","от ударения","от части речи"],"answer":"от значения: усиление отрицания, уступка, устойчивое выражение","hint":"НИ усиливает отрицание: не сказал ни слова. НИ в придаточных уступки: куда ни взгляни, сколько ни старайся. НИ в восклицаниях: ни шагу назад! И в устойчивых выражениях: ни жив ни мёртв, ни рыба ни мясо.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Когда НЕ пишется слитно?","options":["слово без НЕ не употребляется","можно заменить синонимом без НЕ","полное причастие без зависимых слов","НЕДО- в значении «меньше нормы»","есть противопоставление с А","краткое причастие","с числительным"],"answer":"слово без НЕ не употребляется","answers":["слово без НЕ не употребляется","можно заменить синонимом без НЕ","полное причастие без зависимых слов","НЕДО- в значении «меньше нормы»"],"hint":"Слитно: без НЕ не употребляется, есть синоним, причастие без зависимых слов, НЕДО- «меньше нормы».","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Когда НЕ пишется раздельно?","options":["противопоставление с союзом А","со словами «вовсе», «отнюдь», «далеко»","с глаголами и деепричастиями","краткое причастие","с числительными","союз НО","со словами «очень», «совершенно»","слово без НЕ не употребляется"],"answer":"противопоставление с союзом А","answers":["противопоставление с союзом А","со словами «вовсе», «отнюдь», «далеко»","с глаголами и деепричастиями","краткое причастие","с числительными"],"hint":"Раздельно: противопоставление с А, «вовсе/отнюдь/далеко», глаголы и деепричастия, краткие причастия, числительные.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Когда пишется НИ?","options":["без ударения в местоимениях","в придаточном уступки","для усиления отрицания","в устойчивых выражениях","под ударением в местоимениях","в обороте «не кто иной, как»","в обороте «чуть не»"],"answer":"без ударения в местоимениях","answers":["без ударения в местоимениях","в придаточном уступки","для усиления отрицания","в устойчивых выражениях"],"hint":"НИ: без ударения, уступка, усиление отрицания, устойчивые выражения. НЕ: под ударением, «не кто иной, как», «чуть не».","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Какие краткие прилагательные с НЕ пишутся всегда раздельно?","options":["рад","должен","готов","прав","согласен","высок","глубок","интересен"],"answer":"рад","answers":["рад","должен","готов","прав","согласен"],"hint":"Не рад, не должен, не готов, не прав, не согласен, не нужен, не способен — всегда раздельно.","group":"Заучиваем правила"},{"kind":"form","part":"Исключения и слова на запоминание","q":"он ___ (не)рад встрече","options":["не рад","нерад"],"answer":"не рад","hint":"Краткие прилагательные, которые всегда пишутся раздельно: не рад, не должен, не готов, не нужен, не согласен, не прав, не способен.","group":"Запоминаем исключения"},{"kind":"form","part":"Исключения и слова на запоминание","q":"я ___ (не)должен это делать","options":["не должен","недолжен"],"answer":"не должен","hint":"Запомнить раздельно: не должен.","group":"Запоминаем исключения"},{"kind":"form","part":"Исключения и слова на запоминание","q":"он ___ (не)готов к уроку","options":["не готов","неготов"],"answer":"не готов","hint":"Запомнить раздельно: не готов.","group":"Запоминаем исключения"},{"kind":"form","part":"Исключения и слова на запоминание","q":"ты ___ (не)прав","options":["не прав","неправ"],"answer":"не прав","hint":"Запомнить раздельно: не прав.","group":"Запоминаем исключения"},{"kind":"form","part":"Исключения и слова на запоминание","q":"она ___ (не)согласна","options":["не согласна","несогласна"],"answer":"не согласна","hint":"Запомнить раздельно: не согласна.","group":"Запоминаем исключения"},{"kind":"form","part":"Исключения и слова на запоминание","q":"___ (не)доумевать","options":["недоумевать","не доумевать"],"answer":"недоумевать","hint":"Без НЕ не употребляется — только слитно.","group":"Запоминаем исключения"},{"kind":"form","part":"Исключения и слова на запоминание","q":"___ (не)годовать","options":["негодовать","не годовать"],"answer":"негодовать","hint":"Без НЕ не употребляется — только слитно.","group":"Запоминаем исключения"},{"kind":"form","part":"Исключения и слова на запоминание","q":"___ (не)вежда","options":["невежда","не вежда"],"answer":"невежда","hint":"Без НЕ не употребляется — только слитно.","group":"Запоминаем исключения"},{"kind":"form","part":"Исключения и слова на запоминание","q":"___ (не)взлюбить","options":["невзлюбить","не взлюбить"],"answer":"невзлюбить","hint":"Без НЕ не употребляется — только слитно.","group":"Запоминаем исключения"},{"kind":"form","part":"Исключения и слова на запоминание","q":"___ (не)чаянно","options":["нечаянно","не чаянно"],"answer":"нечаянно","hint":"Без НЕ не употребляется — только слитно.","group":"Запоминаем исключения"},{"kind":"form","part":"Исключения и слова на запоминание","q":"___ (не)ряшливый вид","options":["неряшливый","не ряшливый"],"answer":"неряшливый","hint":"Без НЕ не употребляется — только слитно.","group":"Запоминаем исключения"},{"kind":"form","part":"Исключения и слова на запоминание","q":"___ (не)навидеть ложь","options":["ненавидеть","не навидеть"],"answer":"ненавидеть","hint":"Без НЕ не употребляется — только слитно.","group":"Запоминаем исключения"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"___ (не)счастье, а горе","options":["не счастье","несчастье"],"answer":"не счастье","hint":"Есть противопоставление с союзом А — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"случилось ___ (не)счастье","options":["несчастье","не счастье"],"answer":"несчастье","hint":"Можно заменить синонимом «беда» — слитно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"книга оказалась ___ (не)интересной","options":["неинтересной","не интересной"],"answer":"неинтересной","hint":"Можно заменить: «скучной» — слитно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"книга ___ (не)интересная, а скучная","options":["не интересная","неинтересная"],"answer":"не интересная","hint":"Противопоставление с А — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"река ___ (не)широкая, но бурная","options":["неширокая","не широкая"],"answer":"неширокая","hint":"Союз НО не создаёт противопоставления — слитно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"дуб вовсе ___ (не)старый","options":["не старый","нестарый"],"answer":"не старый","hint":"«Вовсе не» усиливает отрицание — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"отнюдь ___ (не)простая задача","options":["не простая","непростая"],"answer":"не простая","hint":"«Отнюдь не» — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"совершенно ___ (не)известный остров","options":["неизвестный","не известный"],"answer":"неизвестный","hint":"«Совершенно» — слово меры, слитному написанию не мешает.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"очень ___ (не)глупый человек","options":["неглупый","не глупый"],"answer":"неглупый","hint":"«Очень» не мешает слитному написанию.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"___ (не)высокий забор","options":["невысокий","не высокий"],"answer":"невысокий","hint":"Можно заменить: «низкий» — слитно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"___ (не)мраморный памятник","options":["не мраморный","немраморный"],"answer":"не мраморный","hint":"Относительное прилагательное (из чего?) — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"___ (не)папин кошелёк","options":["не папин","непапин"],"answer":"не папин","hint":"Притяжательное прилагательное (чей?) — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"___ (не)далеко от дома","options":["недалеко","не далеко"],"answer":"недалеко","hint":"Можно заменить: «близко» — слитно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"___ (не)рядом","options":["не рядом","нерядом"],"answer":"не рядом","hint":"Наречие не на -О — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"___ (не)вовремя","options":["не вовремя","невовремя"],"answer":"не вовремя","hint":"Наречие не на -О — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"___ (не)выше брата","options":["не выше","невыше"],"answer":"не выше","hint":"Сравнительная степень — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"___ (не)пять, а шесть","options":["не пять","непять"],"answer":"не пять","hint":"С числительными всегда раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с существительными, прилагательными, наречиями","q":"___ (не)каждый сможет","options":["не каждый","некаждый"],"answer":"не каждый","hint":"Местоимение «каждый» с НЕ — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с глаголами, деепричастиями, причастиями","q":"лежать, ___ (не)двигаясь","options":["не двигаясь","недвигаясь"],"answer":"не двигаясь","hint":"Деепричастие — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с глаголами, деепричастиями, причастиями","q":"___ (не)знать ответа","options":["не знать","незнать"],"answer":"не знать","hint":"Глагол — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с глаголами, деепричастиями, причастиями","q":"___ (не)годуя, он ушёл","options":["негодуя","не годуя"],"answer":"негодуя","hint":"Без НЕ не употребляется — слитно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с глаголами, деепричастиями, причастиями","q":"___ (не)освещённую комнату","options":["неосвещённую","не освещённую"],"answer":"неосвещённую","hint":"Причастие без зависимых слов — слитно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с глаголами, деепричастиями, причастиями","q":"ещё ___ (не)исследованная местность","options":["не исследованная","неисследованная"],"answer":"не исследованная","hint":"Зависимое слово «ещё» — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с глаголами, деепричастиями, причастиями","q":"___ (не)прочитанная книга","options":["непрочитанная","не прочитанная"],"answer":"непрочитанная","hint":"Без зависимых слов — слитно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с глаголами, деепричастиями, причастиями","q":"___ (не)прочитанная мной книга","options":["не прочитанная","непрочитанная"],"answer":"не прочитанная","hint":"Зависимое слово «мной» — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с глаголами, деепричастиями, причастиями","q":"план ___ (не)выполнен","options":["не выполнен","невыполнен"],"answer":"не выполнен","hint":"Краткое причастие — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с глаголами, деепричастиями, причастиями","q":"задача ___ (не)решена","options":["не решена","нерешена"],"answer":"не решена","hint":"Краткое причастие — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с глаголами, деепричастиями, причастиями","q":"___ (не)смотря на дождь, мы пошли","options":["несмотря","не смотря"],"answer":"несмотря","hint":"Предлог «несмотря на» (= вопреки) — слитно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с глаголами, деепричастиями, причастиями","q":"шёл, ___ (не)смотря под ноги","options":["не смотря","несмотря"],"answer":"не смотря","hint":"Деепричастие «смотря» — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с глаголами, деепричастиями, причастиями","q":"___ (не)доварить суп","options":["недоварить","не доварить"],"answer":"недоварить","hint":"Меньше нормы, можно «переварить» — слитно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с глаголами, деепричастиями, причастиями","q":"___ (не)дочитать книгу до конца","options":["не дочитать","недочитать"],"answer":"не дочитать","hint":"Действие не закончено — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с глаголами, деепричастиями, причастиями","q":"ребёнку ___ (не)достаёт внимания","options":["недостаёт","не достаёт"],"answer":"недостаёт","hint":"«Не хватает» — слитно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ с глаголами, деепричастиями, причастиями","q":"малыш ___ (не)достаёт до стола","options":["не достаёт","недостаёт"],"answer":"не достаёт","hint":"«Не дотягивается» — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ или НИ","q":"(н..)кто не пришёл","options":["никто","некто"],"answer":"никто","hint":"Без ударения — НИ: никтО.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ или НИ","q":"(н..)кого спросить","options":["некого","никого"],"answer":"некого","hint":"Под ударением — НЕ: нЕкого.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ или НИ","q":"(н..)чего бояться","options":["нечего","ничего"],"answer":"нечего","hint":"Под ударением — НЕ: нЕчего.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ или НИ","q":"я (н..)сколько не устал","options":["нисколько","несколько"],"answer":"нисколько","hint":"Без ударения — НИ: нискОлько.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ или НИ","q":"(н..)с кем поговорить","options":["не с кем","ни с кем"],"answer":"не с кем","hint":"Под ударением — НЕ, с предлогом раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ или НИ","q":"куда (н..) взгляни, везде поле","options":["ни","не"],"answer":"ни","hint":"Придаточное уступки — НИ.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ или НИ","q":"сколько (н..) старайся, не успеешь","options":["ни","не"],"answer":"ни","hint":"Придаточное уступки — НИ.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ или НИ","q":"(н..) шагу назад!","options":["ни","не"],"answer":"ни","hint":"Восклицание с отрицанием — НИ.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ или НИ","q":"это был (н..) кто иной, как отец","options":["не","ни"],"answer":"не","hint":"Есть КАК — пишем НЕ раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ или НИ","q":"(н..)кто иной не справится","options":["никто","не кто"],"answer":"никто","hint":"Нет КАК — пишем НИ слитно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ или НИ","q":"он (н..) раз бывал в Москве","options":["не","ни"],"answer":"не","hint":"«Не раз» = много раз.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ или НИ","q":"я (н..) разу не был в Москве","options":["ни","не"],"answer":"ни","hint":"«Ни разу» = никогда.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ или НИ","q":"(н..) жив (н..) мёртв","options":["ни … ни","не … не"],"answer":"ни … ни","hint":"Устойчивое выражение с НИ.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ или НИ","q":"чуть (н..) упал","options":["не","ни"],"answer":"не","hint":"Оборот «чуть не».","group":"Отрабатываем правила на словах"},{"kind":"form","part":"НЕ или НИ","q":"не сказал (н..) слова","options":["ни","не"],"answer":"ни","hint":"НИ усиливает отрицание.","group":"Отрабатываем правила на словах"}],"partDescs":{"Исключения и слова на запоминание":"Слова, которые всегда пишутся с НЕ слитно или всегда раздельно. Их нужно запомнить.","От чего зависит написание":"Вопрос: от чего зависит слитное или раздельное написание НЕ и выбор НЕ / НИ. После ответа — разбор с примерами и исключениями.","В каких случаях пишется: частные случаи":"Выберите все подходящие варианты: верных ответов может быть несколько. После ответа — разбор.","НЕ с существительными, прилагательными, наречиями":"Проверьте: есть ли синоним без НЕ, противопоставление с А, слова «вовсе, отнюдь».","НЕ с глаголами, деепричастиями, причастиями":"Глаголы и деепричастия — раздельно; причастия — смотрим на зависимые слова и краткую форму.","НЕ или НИ":"Под ударением — НЕ, без ударения — НИ; НИ усиливает отрицание и стоит в уступке."},"groupDescs":{"Заучиваем правила":"Карточки о самих правилах: от чего зависит написание и в каких случаях пишется та или иная буква.","Запоминаем исключения":"Слова, которые пишутся не по правилу или которые нужно просто запомнить.","Отрабатываем правила на словах":"Слова с пропусками: применяйте правило. После ответа — объяснение для конкретного слова."}},{"task":"o7","title":"Слитно, раздельно, через дефис","desc":"Сложные слова, ПОЛ- и ПОЛУ-, наречия, предлоги, союзы","exam":"oge","section":"orf","type":"quiz","cards":[{"kind":"rule","part":"От чего зависит написание","q":"Сложное существительное или прилагательное (снегопад, купля-продажа): от чего зависит написание?","options":["от связи между частями: подчинение или равноправие","от ударения","от длины слова","от первой буквы"],"answer":"от связи между частями: подчинение или равноправие","hint":"Если одна часть зависит от другой — слитно: снегопад (падает снег), железнодорожный (железная дорога). Если части равноправны, между ними можно вставить «и» — через дефис: купля-продажа, русско-английский. Всегда через дефис: оттенки цвета (тёмно-синий), стороны света (юго-восток), слова с ВИЦЕ-, ЭКС-, МИНИ-.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"ПОЛ- с существительным (пол-лимона, полдома): от чего зависит написание?","options":["от первой буквы следующего слова","от рода","от значения"],"answer":"от первой буквы следующего слова","hint":"Через дефис перед гласной, перед Л и перед заглавной буквой: пол-огурца, пол-лимона, пол-Москвы. В остальных случаях слитно: полдома, полминуты. ПОЛУ- всегда слитно: полуостров. Исключение: поллитровка.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Наречие с приставкой ПО- (по-новому): от чего зависит написание?","options":["от суффикса на конце","от ударения","от первой буквы"],"answer":"от суффикса на конце","hint":"Через дефис, если на конце -ОМУ, -ЕМУ, -СКИ, -ЦКИ, -И: по-новому, по-немецки, по-волчьи. Но «по новому мосту» — это предлог с прилагательным, раздельно.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Наречие или предлог со словом (вначале / в начале года): от чего зависит написание?","options":["есть ли зависимое слово","от ударения","от длины"],"answer":"есть ли зависимое слово","hint":"Без зависимого слова — наречие, слитно: вначале было трудно, смотреть вдаль. С зависимым словом — раздельно: в начале года, в даль моря.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Производный предлог (вследствие, в течение): от чего зависит написание?","options":["от того, какой это предлог: его нужно запомнить","от ударения","от падежа"],"answer":"от того, какой это предлог: его нужно запомнить","hint":"Слитно: вследствие, ввиду, насчёт, навстречу, вместо, наподобие, несмотря на. Раздельно: в течение, в продолжение, в заключение, в связи с, за счёт. В течение, в продолжение, в заключение на конце пишут Е. Через дефис: из-за, из-под.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Союз или сочетание слов (чтобы / что бы, тоже / то же): от чего зависит написание?","options":["можно ли убрать частицу или заменить слово","от ударения","ни от чего"],"answer":"можно ли убрать частицу или заменить слово","hint":"ЧТОБЫ (цель, БЫ не убрать) — слитно: пришёл, чтобы помочь. ЧТО БЫ (БЫ можно убрать) — раздельно: что бы подарить? ТОЖЕ = «и» — слитно; ТО ЖЕ = «то же самое» — раздельно.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Частицы -ТО, -ЛИБО, -НИБУДЬ, КОЕ-: от чего зависит написание?","options":["ни от чего: всегда через дефис","от ударения","от части речи"],"answer":"ни от чего: всегда через дефис","hint":"Кто-то, где-либо, когда-нибудь, кое-как.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Когда сложное слово пишется через дефис?","options":["части равноправны","оттенки цвета","стороны света","с ВИЦЕ-, ЭКС-, МИНИ-","одна часть зависит от другой","первая часть — числительное","с АВТО-, ФОТО-"],"answer":"части равноправны","answers":["части равноправны","оттенки цвета","стороны света","с ВИЦЕ-, ЭКС-, МИНИ-"],"hint":"Дефис: равноправие частей, цвета, стороны света, ВИЦЕ-/ЭКС-/МИНИ-. Слитно: подчинение, числительное, АВТО-/ФОТО-.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Когда ПОЛ- пишется через дефис?","options":["перед гласной","перед Л","перед заглавной буквой","перед другой согласной","в приставке ПОЛУ-"],"answer":"перед гласной","answers":["перед гласной","перед Л","перед заглавной буквой"],"hint":"Дефис перед гласной, Л и заглавной. Остальное слитно, ПОЛУ- всегда слитно.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Когда наречие с ПО- пишется через дефис?","options":["на -ОМУ, -ЕМУ","на -СКИ, -ЦКИ","на -И","«по новому мосту»","поэтому","понемногу"],"answer":"на -ОМУ, -ЕМУ","answers":["на -ОМУ, -ЕМУ","на -СКИ, -ЦКИ","на -И"],"hint":"Дефис, если ПО- и суффиксы -ому, -ему, -ски, -цки, -и. «По новому мосту» — предлог с прилагательным.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Какие предлоги пишутся слитно?","options":["вследствие","ввиду","насчёт","вместо","наподобие","в течение","в связи с","за счёт"],"answer":"вследствие"," :"на счёт","hint":"Существительное «счёт» — раздельно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"Предлоги и союзы","q":"чай ___ (в)место кофе","options":["вместо","в место"],"answer":"вместо","hint":"Предлог «взамен» — слитно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"Предлоги и союзы","q":"шапка ___ (на)подобие шлема","options":["наподобие","на подобие"],"answer":"наподобие","hint":"Предлог «вроде» — слитно.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"Предлоги и союзы","q":"___ (из)за угла","options":["из-за","изза"],"answer":"из-за","hint":"Предлог через дефис.","group":"Отрабатываем правила на словах"},{"kind":"form","part":"Предлоги и союзы","q":"___ (из)под стола","options":["из-под","изпод"],"answer":"из-под","hint":"Предлог через дефис.","group":"Отрабатываем правила на словах"}],"partDescs":{"Исключения и слова на запоминание":"Сочетания, которые пишутся не по общему правилу. Их нужно запомнить.","От чего зависит написание":"Вопрос: от чего зависит, писать слитно, раздельно или через дефис. После ответа — разбор с примерами и исключениями.","В каких случаях пишется: частные случаи":"Выберите все подходящие варианты: верных ответов может быть несколько. После ответа — разбор.","Сложные слова, ПОЛ- и ПОЛУ-":"Подчинение — слитно, равноправие — дефис; ПОЛ- смотрим на следующую букву.","Наречия":"Дефис после ПО- с -ому/-ски, с частицами; слитно или раздельно — по зависимому слову и словарным спискам.","Предлоги и союзы":"Предлог или существительное, союз или местоимение с частицей: проверьте заменой."},"groupDescs":{"Заучиваем правила":"Карточки о самих правилах: от чего зависит написание и в каких случаях пишется та или иная буква.","Запоминаем исключения":"Слова, которые пишутся не по правилу или которые нужно просто запомнить.","Отрабатываем правила на словах":"Слова с пропусками: применяйте правило. После ответа — объяснение для конкретного слова."}},{"task":"o8","title":"Ь и окончания","desc":"Мягкий знак после шипящих, в глаголах и числительных; гласные в окончаниях существительных и прилагательных","exam":"oge","section":"orf","type":"quiz","cards":[{"kind":"rule","part":"От чего зависит написание","q":"Ь на конце слова после шипящей (рожь, нож, горяч): от чего зависит написание?","options":["от части речи и формы слова","от мягкости согласной","от ударения"],"answer":"от части речи и формы слова","hint":"После Ж, Ш, Ч, Щ Ь мягкость не обозначает, он показывает форму. Пишем Ь: у существительных женского рода 3-го склонения (рожь, ночь), у глаголов (беречь, режешь, режь), у наречий (настежь, вскачь). Не пишем: у существительных мужского рода (нож, врач), во мн. ч. Р. п. (туч, задач), у кратких прилагательных (горяч, хорош). Исключения: уж, замуж, невтерпёж — без Ь.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"-ТСЯ или -ТЬСЯ в глаголе: от чего зависит написание?","options":["от вопроса к глаголу","от ударения","от времени"],"answer":"от вопроса к глаголу","hint":"Если глагол отвечает на вопрос «что делать? что сделать?» (с Ь), пишем -ТЬСЯ: надо учиться. Если «что делает? что сделает?» (без Ь), пишем -ТСЯ: он учится.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Ь в числительных (пять, пятьдесят, сорок): от чего зависит, где он пишется?","options":["от того, какое это число","от ударения","от падежа"],"answer":"от того, какое это число","hint":"От 5 до 20 и 30 — Ь на конце: пять, двадцать. 50–80 и 500–900 — Ь в середине: пятьдесят, семьсот. 40, 90, 100, 200–400 — Ь не пишется: сорок, двести.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"О или Е после шипящих и Ц в окончаниях (ножом, сторожем): от чего зависит выбор?","options":["от ударения","от рода","от склонения"],"answer":"от ударения","hint":"Под ударением пишем О: ножОм, свечОй, отцОм. Без ударения Е: сторожЕм, тучЕй, пальцЕм.","group":"Заучиваем правила"},{"kind":"rule","part":"   function saveMe(v) {
    me = v;
    lsSet(ME_KEY, v);
    server = null;
    if (v) { lsSet(ASKED_KEY, true); loadServerStats(); }
  }

  /* ---------- Запись ответов ---------- */
  let queue = lsGet(QUEUE_KEY) || [];
  let flushing = false;

  /* ---------- Локальный прогресс: ошибки, серия дней, выученные карточки ---------- */
  const PROG_KEY = 'nareshka-progress';
  const MIST_KEY = 'nareshka-mistakes';
  const DAYS_KEY = 'nareshka-days';
  const FLAGS_KEY = 'nareshka-flags';
  const BADGES_SENT_KEY = 'nareshka-badges-sent';
  const DAY_MIN = 10; // день засчитывается в серию после 10 карточек
  let progress = lsGet(PROG_KEY) || {}; // { модуль: [ключи карточек, решённых верно с первой попытки] }
  let mistakes = lsGet(MIST_KEY) || {}; // { ключ карточки: { m: модуль, t: время } }
  let days = lsGet(DAYS_KEY) || {};     // { 'ГГГГ-ММ-ДД': сколько ответов }
  let flags = lsGet(FLAGS_KEY) || {};   // { night, early }
  let server = null;                    // статистика с сервера (для зарегистрированных)
  const progSets = {};
  const progSet = id => progSets[id] || (progSets[id] = new Set(progress[id] || []));
  const dateKey = d => {
    const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
    return z.toISOString().slice(0, 10);
  };

  window.trackAnswer = (s, card, ok) => {
    const mod = (s.mod.modOf && s.mod.modOf.get(card)) || s.mod;
    const key = cardKey(card);
    const first = s.round === 1; // в зачёт идёт только первая попытка
    if (first && ok) {
      const set = progSet(mod.id);
      if (!set.has(key)) { set.add(key); progress[mod.id] = [...set]; lsSet(PROG_KEY, progress); }
      if (mistakes[key]) { delete mistakes[key]; lsSet(MIST_KEY, mistakes); }
    } else if (first) {
      mistakes[key] = { m: mod.id, t: Date.now() };
      lsSet(MIST_KEY, mistakes);
    }
    const now = new Date();
    const d = dateKey(now);
    days[d] = (days[d] || 0) + 1;
    lsSet(DAYS_KEY, days);
    const hr = now.getHours();
    if (hr >= 22 && !flags.night) { flags.night = true; lsSet(FLAGS_KEY, flags); }
    if (hr >= 4 && hr < 7 && !flags.early) { flags.early = true; lsSet(FLAGS_KEY, flags); }
    if (!me || !first || mod.virtual) return;
    queue.push({ m: mod.id, p: card.part || '', k: key.slice(0, 200), c: !!ok });
    lsSet(QUEUE_KEY, queue);
    if (queue.length >= 10) flushTrack();
  };

  function progressOf(mod) {
    if (!mod.cards.length) return 0;
    const local = progSet(mod.id).size;
    const remote = server && server.modules ? Number(server.modules[mod.id] || 0) : 0;
    return Math.min(100, Math.floor(Math.max(local, remote) / mod.cards.length * 100));
  }

  window.tileExtra = mod => (mod.cards.length
    ? h('div', { class: 'tile-prog' },
        h('div', { class: 'progress' }, h('i', { style: `width:${progressOf(mod)}%` })),
        h('span', { class: 'count', text: `выучено ${progressOf(mod)}%` }))
    : '');

  function allDays() {
    const all = { ...days };
    if (server && server.days) for (const [d, n] of Object.entries(server.days)) all[d] = Math.max(all[d] || 0, Number(n));
    return all;
  }

  function streakInfo() {
    const all = allDays();
    const d = new Date();
    const todayCount = all[dateKey(d)] || 0;
    const doneToday = todayCount >= DAY_MIN;
    if (!doneToday) d.setDate(d.getDate() - 1);
    let n = 0;
    while ((all[dateKey(d)] || 0) >= DAY_MIN) { n++; d.setDate(d.getDate() - 1); }
    if (doneToday) n = Math.max(n, 1);
    // лучшая серия за всё время
    const good = Object.keys(all).filter(k => all[k] >= DAY_MIN).sort();
    let best = 0, run = 0, prev = null;
    for (const k of good) {
      const cur = new Date(k + 'T12:00:00');
      run = prev && (cur - prev) / 86400000 === 1 ? run + 1 : 1;
      best = Math.max(best, run);
      prev = cur;
    }
    return { n, doneToday, todayCount, best };
  }

  function cardIndex() {
    const idx = new Map();
    for (const m of state.modules) for (const c of m.cards) {
      const k = cardKey(c);
      if (!idx.has(k)) idx.set(k, { card: c, mod: m });
    }
    return idx;
  }

  function mistakeItems() {
    const idx = cardIndex();
    const out = [];
    for (const [k, v] of Object.entries(mistakes)) {
      const hit = idx.get(k);
      if (!hit) continue;
      const mod = state.modules.find(m => m.id === v.m) || hit.mod;
      out.push({ card: hit.card, mod });
    }
    return out;
  }

  function virtualSession(title, items) {
    const mod = { id: 'v', title, exam: '', cards: items.map(x => x.card), virtual: true, modOf: new Map(items.map(x => [x.card, x.mod])) };
    startSession(mod, 'all');
  }

  function dayCard() {
    const pool = [];
    for (const id of ['t4', 't5', 't7', 't9', 't10']) {
      const m = state.modules.find(x => x.id === id);
      if (m) for (const c of m.cards) pool.push({ card: c, mod: m });
    }
    if (!pool.length) return null;
    let hash = 0;
    for (const ch of dateKey(new Date())) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
    return pool[(hash * 2654435761 >>> 0) % pool.length];
  }

  function badgeDefs() {
    const list = [
      { id: 'streak3', icon: '✨', name: 'Три дня подряд', desc: `Заниматься 3 дня подряд (от ${DAY_MIN} карточек в день)`, ok: s => s.best >= 3 },
      { id: 'streak7', icon: '🔥', name: 'Неделя без пропусков', desc: `Заниматься 7 дней подряд (от ${DAY_MIN} карточек в день)`, ok: s => s.best >= 7 },
      { id: 'streak30', icon: '🌋', name: 'Месяц без пропусков', desc: `Заниматься 30 дней подряд (от ${DAY_MIN} карточек в день)`, ok: s => s.best >= 30 },
      { id: 'week100', icon: '💯', name: 'Сотня за неделю', desc: '100 карточек верно с первой попытки за одну неделю (нужна регистрация)', ok: s => s.week >= 100 },
      { id: 'total1000', icon: '🏔️', name: 'Тысячник', desc: '1000 разных карточек верно с первой попытки', ok: s => s.total >= 1000 },
      { id: 'night', icon: '🦉', name: 'Ночная сова', desc: 'Позаниматься после 22:00', ok: s => s.night },
      { id: 'early', icon: '🐓', name: 'Ранняя пташка', desc: 'Позаниматься с 4 до 7 утра', ok: s => s.early }
    ];
    for (const m of state.modules) {
      const b = MOD_BADGES[m.id];
      if (b && m.cards.length) list.push({ id: 'm_' + m.id, icon: b[0], name: b[1], desc: `Все карточки темы «${moduleName(m)}» (${m.exam === 'oge' ? 'ОГЭ' : 'ЕГЭ'}) решены верно`, ok: () => progressOf(m) >= 100 });
    }
    return list;
  }
  const iconOf = id => {
    if (id.startsWith('m_')) return (MOD_BADGES[id.slice(2)] || [''])[0];
    return { streak3: '✨', streak7: '🔥', streak30: '🌋', week100: '💯', total1000: '🏔️', night: '🦉', early: '🐓' }[id] || '';
  };
  function badgeState() {
    const st = streakInfo();
    const localTotal = Object.values(progress).reduce((n, a) => n + a.length, 0);
    const s = {
      best: st.best,
      week: server ? Number(server.week || 0) : 0,
      total: Math.max(localTotal, server ? Number(server.total || 0) : 0),
      night: !!(flags.night || (server && server.night)),
      early: !!(flags.early || (server && server.early))
    };
    return badgeDefs().map(b => ({ ...b, earned: !!b.ok(s) }));
  }
  function syncBadges() {
    if (!me) return;
    const ids = badgeState().filter(b => b.earned).map(b => b.id).sort();
    const sent = lsGet(BADGES_SENT_KEY);
    if (sent && sent.code === me.code && sent.ids.join() === ids.join()) return;
    rpc('set_badges', { p_code: me.code, p_badges: ids })
      .then(() => lsSet(BADGES_SENT_KEY, { code: me.code, ids }))
      .catch(() => { /* попробуем в следующий раз */ });
  }

  function achievements() {
    const st = streakInfo();
    const list = badgeState();
    const got = list.filter(b => b.earned).length;
    const exams = [['ege', 'ЕГЭ'], ['oge', 'ОГЭ']];
    openModal(h('div', { class: 'dlg' },
      h('h2', { id: 'modal-title', text: 'Мои достижения' }),
      h('p', { class: 'dlg-sub', text: `Серия: ${st.n} ${plural(st.n, 'день', 'дня', 'дней')} подряд, лучшая — ${st.best}. День засчитывается, если решено от ${DAY_MIN} карточек.` }),
      h('h3', { class: 'ach-title', text: `Значки: ${got} из ${list.length}` }),
      h('div', { class: 'badges' }, list.map(b => h('div', { class: 'badge' + (b.earned ? ' on' : '') },
        h('span', { class: 'badge-icon', text: b.icon }),
        h('span', { class: 'badge-text' }, h('b', { text: b.name }), h('small', { text: b.desc }))
      ))),
      h('h3', { class: 'ach-title', text: 'Сколько выучено' }),
      h('p', { class: 'dlg-sub', text: 'Выученной считается карточка, которую вы хотя бы раз решили верно с первой попытки.' }),
      exams.map(([id, name]) => {
        const mods = state.modules.filter(m => m.exam === id && m.cards.length);
        return mods.length ? h('div', { class: 'ach-progress' }, h('b', { text: name }), mods.map(m => h('div', { class: 'ach-row' },
          h('span', { text: moduleName(m) }),
          h('div', { class: 'progress' }, h('i', { style: `width:${progressOf(m)}%` })),
          h('span', { class: 'count', text: progressOf(m) + '%' })
        ))) : '';
      }),
      !me && h('p', { class: 'privacy', text: 'Без регистрации достижения хранятся только на этом устройстве и не видны в рейтинге.' }),
      h('div', { class: 'dlg-actions' }, h('button', { class: 'btn primary', type: 'button', text: 'Закрыть', onclick: closeModal }))
    ));
  }

  async function loadServerStats() {
    if (!me) return;
    try {
      const st = await rpc('my_stats', { p_code: me.code });
      if (st) { server = st; if (!session) route(); syncBadges(); }
    } catch (x) { /* офлайн */ }
  }

  async function flushTrack() {
    if (!me || flushing || !queue.length) return;
    flushing = true;
    const batch = queue.slice(0, 200);
    try {
      await rpc('record', { p_code: me.code, p_items: batch });
      queue = queue.slice(batch.length);
      lsSet(QUEUE_KEY, queue);
      syncBadges();
    } catch (x) {
      if (x.status === 400 && /Код не найден/.test(x.message)) { queue = []; lsSet(QUEUE_KEY, queue); }
    } finally { flushing = false; }
  }
  window.flushTrack = flushTrack;
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushTrack(); });
  setInterval(flushTrack, 60000);

  /* ---------- Главная: панель пользователя ---------- */
  let installEvent = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; if (!session && !location.hash) route(); });

  window.homeExtras = () => {
    const st = streakInfo();
    const mist = mistakeItems();
    const dc = dayCard();
    const left = Math.max(0, DAY_MIN - st.todayCount);
    let dcText = '';
    if (dc) { const q = buildQuestion(dc.card); dcText = `${q.label} ${q.prompt}`; }
    return h('div', { class: 'home-extras' },
      h('div', { class: 'userbar' },
        me
          ? h('button', { class: 'btn', type: 'button', onclick: profile }, '👤 ', me.nickname)
          : h('button', { class: 'btn', type: 'button', text: 'Войти или зарегистрироваться', onclick: welcome }),
        h('button', { class: 'btn', type: 'button', text: '🏆 Рейтинг', onclick: () => go('rating') }),
        h('button', { class: 'btn', type: 'button', text: '🏅 Достижения', onclick: achievements }),
        installEvent && h('button', { class: 'btn', type: 'button', text: '📲 Установить на телефон', onclick: async () => {
          installEvent.prompt();
          try { await installEvent.userChoice; } catch (x) { /* ничего */ }
          installEvent = null;
          route();
        } }),
        h('button', { class: 'btn quiet', type: 'button', text: 'Как это работает?', onclick: () => help() }),
        h('button', { class: 'btn quiet', type: 'button', text: 'Вход для преподавателя', onclick: () => go('teacher') })
      ),
      h('div', { class: 'home-cards' },
        h('div', { class: 'hcard' + (st.doneToday ? ' done' : '') },
          h('b', { text: st.n ? `🔥 ${st.n} ${plural(st.n, 'день', 'дня', 'дней')} подряд` : '🔥 Серия дней' }),
          h('span', { text: st.doneToday
            ? 'Сегодня вы уже позанимались. Так держать!'
            : `Решите сегодня ещё ${left} ${plural(left, 'карточку', 'карточки', 'карточек')}, чтобы ${st.n ? 'не потерять серию' : 'начать серию'}.` })
        ),
        mist.length
          ? h('button', { class: 'hcard action', type: 'button', onclick: () => go('mistakes') },
              h('b', { text: `🔁 Повторить мои ошибки (${mist.length})` }),
              h('span', { text: 'Карточки, где вы ошиблись. Ответите верно с первой попытки — карточка уйдёт из списка.' }))
          : h('div', { class: 'hcard' },
              h('b', { text: '🔁 Мои ошибки' }),
              h('span', { text: 'Здесь появятся карточки, где вы ошиблись, чтобы их повторить.' })),
        dc && h('button', { class: 'hcard action', type: 'button', onclick: () => go('daycard') },
          h('b', { text: '⭐ Карточка дня' }),
          h('span', { text: dcText }))
      )
    );
  };

  /* ---------- Рейтинг ---------- */
  let ratingScope = 'week';

  /* ---------- Кабинет учителя ---------- */
  function renderTeacherLogin(msg) {
    const email = h('input', { type: 'email', id: 't-email', autocomplete: 'username', required: true });
    const pass = h('input', { type: 'password', id: 't-pass', autocomplete: 'current-password', required: true });
    const err = h('p', { class: 'form-err', 'aria-live': 'polite', text: msg || '' });
    app.replaceChildren(
      h('header', { class: 'page-head' },
        h('button', { class: 'btn', type: 'button', text: '← На главную', onclick: () => go('') }),
        h('h1', { class: 'page-title', text: 'Кабинет преподавателя' })
      ),
      h('form', {
        class: 'card teacher-login',
        onsubmit: async e => {
          e.preventDefault();
          err.textContent = '';
          try {
            const res = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
              method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: email.value.trim(), password: pass.value })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.access_token) { err.textContent = 'Неверная почта или пароль.'; return; }
            teacherToken = data.access_token;
            try { sessionStorage.setItem('nareshka-teacher', teacherToken); } catch (x) { /* только до перезагрузки */ }
            renderTeacher();
          } catch (x) { err.textContent = 'Нет связи с сервером.'; }
        }
      },
        h('label', { class: 'field', for: 't-email' }, 'Почта', email),
        h('label', { class: 'field', for: 't-pass' }, 'Пароль', pass),
        err,
        h('button', { class: 'btn primary', type: 'submit', text: 'Войти' })
      )
    );
  }

  const fmtDate = d => (d ? new Date(d).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—');
  const modName = id => { const m = state.modules.find(x => x.id === id); return m ? (m.exam === 'oge' ? 'ОГЭ: ' : 'ЕГЭ ') + moduleName(m) : id; };

  async function renderTeacher() {
    if (!teacherToken) { renderTeacherLogin(); return; }
    const body = h('div', { class: 'teacher-body' }, h('p', { class: 'empty', text: 'Загружаем…' }));
    app.replaceChildren(
      h('header', { class: 'page-head' },
        h('button', { class: 'btn', type: 'button', text: '← На главную', onclick: () => go('') }),
        h('h1', { class: 'page-title', text: 'Кабинет преподавателя' }),
        h('div', { class: 'userbar' },
          h('button', { class: 'btn', type: 'button', text: '↻ Обновить', onclick: renderTeacher }),
          h('button', { class: 'btn quiet', type: 'button', text: 'Выйти', onclick: () => {
            teacherToken = null;
            try { sessionStorage.removeItem('nareshka-teacher'); } catch (x) { /* ничего */ }
            go('');
          } })
        )
      ),
      body
    );
    let stats, hard;
    try {
      [stats, hard] = await Promise.all([rpc('teacher_stats', {}, teacherToken), rpc('teacher_hard', {}, teacherToken)]);
    } catch (x) {
      if (x.status === 401 || /JWT|expired|Нет доступа/.test(x.message)) {
        teacherToken = null;
        try { sessionStorage.removeItem('nareshka-teacher'); } catch (y) { /* ничего */ }
        renderTeacherLogin(/Нет доступа/.test(x.message) ? 'У этой учётной записи нет доступа к кабинету.' : 'Сессия истекла, войдите снова.');
        return;
      }
      body.replaceChildren(h('p', { class: 'empty', text: 'Не удалось загрузить данные: ' + x.message }));
      return;
    }
    const pct = r => (Number(r.answers) ? Math.round(Number(r.correct) / Number(r.answers) * 100) + '%' : '—');
    const modsText = r => Object.entries(r.modules || {}).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => `${modName(k)} (${v})`).join(', ') || '—';
    body.replaceChildren(
      h('section', { class: 'teacher-sec' },
        h('h2', { text: `Ученики (${stats.length})` }),
        h('p', { class: 'pick-hint', text: 'Нажмите на фамилию, чтобы открыть карточку ученика: слабые места, трудные слова и отчёт для родителей.' }),
        stats.length
          ? h('div', { class: 'table-wrap' }, h('table', { class: 'tbl' },
              h('thead', {}, h('tr', {}, ['Класс', 'Ученик', 'Ник', 'Код', 'Последний вход', 'Очки за неделю', 'Ответов за неделю', 'Всего ответов', 'Верно', 'Чаще решает', ''].map(t => h('th', { text: t })))),
              h('tbody', {}, stats.map(r => h('tr', {},
                h('td', { text: r.grade }),
                h('td', {}, h('button', { class: 'linkbtn', type: 'button', text: `${r.last_name} ${r.first_name}`, onclick: () => go('stu-' + r.code) })),
                h('td', { text: r.nickname }),
                h('td', { class: 'mono', text: r.code }),
                h('td', { text: fmtDate(r.last_seen) }),
                h('td', { class: 'num', text: r.week_points }),
                h('td', { class: 'num', text: r.week_answers }),
                h('td', { class: 'num', text: r.answers }),
                h('td', { class: 'num', text: pct(r) }),
                h('td', { text: modsText(r) }),
                h('td', {}, h('button', { class: 'btn quiet', type: 'button', text: 'Удалить', onclick: () => confirmDialog({
                  title: `Удалить ${r.last_name} ${r.first_name}?`,
                  text: 'Ученик и все его ответы будут удалены. Отменить это нельзя.',
                  okText: 'Удалить',
                  onOk: async () => {
                    try { await rpc('teacher_delete', { p_code: r.code }, teacherToken); toast('Удалено'); renderTeacher(); } catch (x) { toast(x.message); }
                  }
                }) }))
              )))
            ))
          : h('p', { class: 'empty', text: 'Пока никто из учеников не зарегистрировался.' })
      ),
      h('section', { class: 'teacher-sec' },
        h('h2', { text: 'Где ошибаются чаще всего' }),
        hard.length
          ? h('div', { class: 'table-wrap' }, h('table', { class: 'tbl' },
              h('thead', {}, h('tr', {}, ['Задание', 'Карточка', 'Ошибок', 'Всего ответов'].map(t => h('th', { text: t })))),
              h('tbody', {}, hard.map(r => h('tr', {},
                h('td', { text: modName(r.module) }),
                h('td', { text: String(r.card_key).replace(/^[wq]:/, '').split('|')[0] }),
                h('td', { class: 'num', text: r.wrong }),
                h('td', { class: 'num', text: r.total })
              )))
            ))
          : h('p', { class: 'empty', text: 'Ошибок пока нет.' })
      )
    );
  }

  /* ---------- Карточка ученика и отчёт для родителей ---------- */
  const cardText = key => {
    const k = String(key);
    if (k.startsWith('w:')) return k.slice(2).split('|')[0];
    const [q, a] = k.slice(2).split('|');
    return a ? `${a} — «${q.length > 70 ? q.slice(0, 70) + '…' : q}»` : q;
  };
  const pctOf = (c, n) => (Number(n) ? Math.round(Number(c) / Number(n) * 100) : 0);
  const fmtDay = d => new Date(d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });

  function buildReport(data) {
    const l = data.learner;
    const ws = new Date(data.week_start);
    const we = new Date(ws.getTime() + 6 * 86400000);
    const w = data.week;
    const mods = Object.entries(data.week_modules || {}).sort((a, b) => b[1] - a[1]).map(([m, n]) => `${modName(m)} — ${n}`);
    const weak = (data.parts || []).filter(p => p.answers >= 5).map(p => ({ ...p, pct: pctOf(p.correct, p.answers) }))
      .filter(p => p.pct < 80).sort((a, b) => a.pct - b.pct).slice(0, 4).map(p => `${modName(p.module)}, «${p.part}» (${p.pct}% верно)`);
    const hardWords = (data.hard || []).slice(0, 6).map(x => cardText(x.card_key).split(' — ')[0]);
    const lines = [
      'Отчёт о занятиях в тренажёре «нарешка»',
      `Ученик: ${l.last_name} ${l.first_name}, ${/^\d+$/.test(l.grade) ? l.grade + ' класс' : l.grade}`,
      `Неделя: ${fmtDay(ws)} — ${fmtDay(we)}`,
      `Занимался(ась) дней: ${w.days} из 7`,
      `Решено карточек: ${w.answers}, верно с первой попытки: ${pctOf(w.correct, w.answers)}%`
    ];
    if (mods.length) lines.push('Темы недели: ' + mods.join('; '));
    if (weak.length) lines.push('Над чем стоит поработать: ' + weak.join('; '));
    if (hardWords.length) lines.push('Трудные слова: ' + hardWords.join(', '));
    lines.push(`Преподаватель: ${TEACHER}`);
    return lines.join('\n');
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); toast('Отчёт скопирован — вставьте его в мессенджер'); return; } catch (x) { /* покажем текст */ }
    const area = h('textarea', { id: 'report-text', readonly: true, 'aria-label': 'Отчёт' });
    area.value = text;
    openModal(h('div', { class: 'dlg' },
      h('h2', { id: 'modal-title', text: 'Отчёт для родителей' }),
      h('p', { class: 'dlg-sub', text: 'Скопировать автоматически не получилось. Выделите текст и скопируйте его.' }),
      area,
      h('div', { class: 'dlg-actions' }, h('button', { class: 'btn primary', type: 'button', text: 'Закрыть', onclick: closeModal }))
    ));
    area.focus();
    area.select();
  }

  async function renderTeacherStudent(code) {
    if (!teacherToken) { renderTeacherLogin(); return; }
    const body = h('div', { class: 'teacher-body' }, h('p', { class: 'empty', text: 'Загружаем…' }));
    app.replaceChildren(
      h('header', { class: 'page-head' },
        h('button', { class: 'btn', type: 'button', text: '← Все ученики', onclick: () => go('teacher') })
      ),
      body
    );
    let data;
    try { data = await rpc('teacher_student', { p_code: code }, teacherToken); } catch (x) {
      if (x.status === 401 || /JWT|expired/.test(x.message)) { teacherToken = null; renderTeacherLogin('Сессия истекла, войдите снова.'); return; }
      body.replaceChildren(h('p', { class: 'empty', text: 'Не удалось загрузить: ' + x.message }));
      return;
    }
    const l = data.learner;
    const w = data.week;
    const parts = (data.parts || []).map(p => ({ ...p, pct: pctOf(p.correct, p.answers) }));

<script>
'use strict';

/* ---------- Константы ---------- */
const STORE_KEY = 'nareshka-v1';
const ADMIN_KEY = 'nareshka-admin';
const VOWELS = 'аеёиоуыэюя';
const EXAMS = [
  { id: 'oge', name: 'ОГЭ', sub: '9 класс', sections: [{ id: 'orf', name: 'Орфография', sub: 'Корни, приставки, суффиксы, окончания, Н/НН, НЕ/НИ, Ь' }] },
  { id: 'ege', name: 'ЕГЭ', sub: '11 класс' }
];
const BUILTIN = [
  { id: 't4', exam: 'ege', num: '4', title: 'Ударения', desc: 'Орфоэпические нормы', type: 'accent' },
  { id: 't5', exam: 'ege', num: '5', title: 'Паронимы', desc: 'Значения слов и сочетания с ними', type: 'quiz' },
  { id: 't6', exam: 'ege', num: '6', title: 'Лексические нормы', desc: 'Лишние слова и неточная сочетаемость', type: 'quiz' },
  { id: 't7', exam: 'ege', num: '7', title: 'Грамматические нормы', desc: 'Формы существительных, числительных, глаголов', type: 'quiz' },
  { id: 't9', exam: 'ege', num: '9', title: 'Словарные слова', desc: 'Непроверяемые гласные в корне', type: 'quiz' },
  { id: 't10', exam: 'ege', num: '10', title: 'Приставки', desc: 'Только сложные случаи: ПРЕ/ПРИ, З/С, Ы/И, Ъ/Ь', type: 'quiz' }
];

/* ---------- Утилиты ---------- */
const app = document.getElementById('app');
const modal = document.getElementById('modal');
const toastEl = document.getElementById('toast');

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid != null && kid !== false) el.append(kid);
  }
  return el;
}

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b === 1) return one;
  if (b >= 2 && b <= 4) return few;
  return many;
}
const cardsWord = n => n + ' ' + plural(n, 'карточка', 'карточки', 'карточек');

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let toastTimer = null;
function toast(message) {
  toastEl.textContent = message;
  toastEl.hidden = false;
  // Внутри открытого <dialog> обычный элемент оказался бы под окном, поэтому переносим туда.
  (modal.open ? modal : document.body).append(toastEl);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, 3500);
}

/* ---------- Разбор карточек ---------- */
const isVowel = ch => VOWELS.includes(ch.toLowerCase());
const isStressed = ch => isVowel(ch) && ch !== ch.toLowerCase();

// Приводит «звонИт», «зво́нит», «жёлудь» к единой записи с одной заглавной ударной гласной.
function parseAccentWord(input) {
  let text = String(input == null ? '' : input).normalize('NFC').trim();
  text = text.replace(new RegExp('([' + VOWELS + '])\\u0301', 'gi'), (_, v) => v.toUpperCase());
  let note = '';
  const m = text.match(/^(.*?)\s*\((.+)\)\s*$/);
  if (m) { text = m[1]; note = m[2].trim(); }
  if (!text) return { error: 'пустое слово' };

  const chars = [...text];
  const vowelCount = chars.filter(isVowel).length;
  let stressed = chars.filter(isStressed).length;
  if (stressed === 0 && chars.filter(c => c === 'ё').length === 1) {
    chars[chars.indexOf('ё')] = 'Ё';
    stressed = 1;
  }
  if (stressed === 0) return { error: `«${text}»: нет ударения. Напишите ударную гласную заглавной: звонИт` };
  if (stressed > 1) return { error: `«${text}»: заглавной должна быть только одна гласная` };
  if (vowelCount < 2) return { error: `«${text}»: одна гласная, выбирать ударение не из чего` };

  const word = chars.map(c => (isStressed(c) ? c : c.toLowerCase())).join('');
  return { card: note ? { word, note } : { word } };
}

function normalizeCard(raw) {
  if (typeof raw === 'string') return parseAccentWord(raw);
  if (!raw || typeof raw !== 'object') return { error: 'карточка не распознана' };

  const hint = raw.hint ? String(raw.hint).trim() : '';
  const part = raw.part ? String(raw.part).trim() : '';
  if (raw.word != null) {
    const res = parseAccentWord(raw.word);
    if (res.card) {
      if (raw.note) res.card.note = String(raw.note).trim();
      if (hint) res.card.hint = hint;
      if (part) res.card.part = part;
    }
    return res;
  }

  const q = String(raw.q == null ? '' : raw.q).trim();
  if (!q) return { error: 'карточка без вопроса (поле "q")' };
  if (!Array.isArray(raw.options)) return { error: `«${q}»: нет вариантов (поле "options")` };
  const options = [...new Set(raw.options.map(o => String(o).trim()).filter(Boolean))];
  const answer = String(raw.answer == null ? '' : raw.answer).trim();
  if (options.length < 2) return { error: `«${q}»: нужно минимум два разных варианта` };
  if (!options.includes(answer)) return { error: `«${q}»: ответа «${answer}» нет среди вариантов` };
  const card = { q, options, answer };
  if (hint) card.hint = hint;
  if (part) card.part = part;
  if (raw.kind) card.kind = raw.kind;
  if (raw.def) card.def = String(raw.def).trim();
  if (raw.group) card.group = String(raw.group);
  if (Array.isArray(raw.hits)) card.hits = raw.hits;
  if (Array.isArray(raw.explain)) card.explain = raw.explain;
  // answers: все верные варианты, если подходит несколько паронимов.
  if (Array.isArray(raw.answers)) {
    const all = [...new Set([answer, ...raw.answers.map(a => String(a).trim())])];
    const stray = all.find(a => !options.includes(a));
    if (stray) return { error: `«${q}»: ответа «${stray}» нет среди вариантов` };
    if (all.length > 1) card.answers = all;
  }
  return { card };
}

const cardKey = c => (c.word ? 'w:' + c.word + '|' + (c.note || '') : 'q:' + c.q.toLowerCase() + '|' + c.answer.toLowerCase());
const answersOf = c => c.answers || [c.answer];

// Одна карточка на каждый пример: значение и контекст вместе, варианты согласованы с контекстом.
// e.f: формы всех слов группы для этого примера, в порядке g.words. После ответа показывается разбор группы.
function expandParonyms(groups) {
  const cards = [];
  const text = e => (typeof e === 'string' ? e : e.t);
  for (const g of groups) {
    const lemmas = g.words.map(x => x.w);
    const explain = g.words.map(x => ({ w: x.w, m: x.m.map(m => ({ d: m.d, ex: m.ex.map(text) })) }));
    for (const word of g.words) {
      for (const m of word.m) {
        for (const e of m.ex) {
          const forms = e.f || lemmas;
          const formOf = w => forms[lemmas.indexOf(w)];
          const hits = [word.w, ...(e.also || [])];
          cards.push({
            kind: 'use', def: m.d, q: text(e).replace(/\[[^\]]+\]/, '___'),
            options: forms, answer: formOf(word.w), answers: hits.map(formOf), hits, explain, part: g.part
          });
        }
      }
    }
  }
  return cards;
}

const setCards = set => (Array.isArray(set.paronyms) ? expandParonyms(set.paronyms) : set.cards);
const isSet = x => x && (Array.isArray(x.cards) || Array.isArray(x.paronyms));

// Разбивает по запятым и переносам, но не внутри скобок: «красИвее (сравн., прил.)».
function splitWords(text) {
  const out = [];
  let depth = 0, cur = '';
  for (const ch of text) {
    if (ch === '(') depth++;
    if (ch === ')') depth = Math.max(0, depth - 1);
    if (depth === 0 && /[,;\n]/.test(ch)) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(s => s.trim()).filter(Boolean);
}

function parseLine(line) {
  const hashAt = line.indexOf('#');
  const hint = hashAt >= 0 ? line.slice(hashAt + 1).trim() : '';
  const parts = (hashAt >= 0 ? line.slice(0, hashAt) : line).split('|').map(s => s.trim());
  const card = { q: parts[0], options: parts.slice(1), answer: parts[1] };
  if (hint) card.hint = hint;
  return card;
}

function parsePlain(text, type, errors) {
  const cards = [];
  for (const line of text.split('\n').map(s => s.trim()).filter(Boolean)) {
    if (line.includes('|')) cards.push(parseLine(line));
    else if (type === 'accent') cards.push(...splitWords(line));
    else errors.push(`«${line}»: нужен формат «вопрос | верный ответ | неверный ответ»`);
  }
  return cards;
}

function jsonToSets(data) {
  if (Array.isArray(data)) {
    return data.length > 0 && data.every(isSet) ? data : [{ cards: data }];
  }
  if (data && typeof data === 'object') {
    if (Array.isArray(data.sets)) return data.sets.filter(isSet);
    if (isSet(data)) return [data];
    if (data.word != null || data.q != null) return [{ cards: [data] }];
  }
  return null;
}

function findModule(task, title) {
  const mods = state.modules;
  if (task != null && task !== '') {
    const plain = String(task).trim().toLowerCase();
    const short = plain.replace('задание', '').replace(/[№\s]/g, '');
    const hit = mods.find(m => m.id === plain || m.num === short || m.title.toLowerCase() === plain);
    if (hit) return hit;
  }
  if (title) return mods.find(m => m.title.toLowerCase() === String(title).trim().toLowerCase()) || null;
  return null;
}

// Возвращает группы карточек с модулем назначения, ошибки и предупреждения. Ничего не сохраняет.
function parseImport(text, current) {
  const res = { groups: [], errors: [], warnings: [], fatal: '', valid: 0 };
  const t = text.trim().replace(/^```[a-zA-Z]*\s*/, '').replace(/\s*```$/, '').trim();
  if (!t) return res;

  let sets;
  if (/^[\[{]/.test(t)) {
    let data;
    try { data = JSON.parse(t); } catch (e) {
      res.fatal = 'JSON не читается. Проверьте, что скопирована вся строка, от первой скобки до последней.';
      return res;
    }
    sets = jsonToSets(data);
    if (!sets) { res.fatal = 'В JSON нет списка карточек. Пример формата открывается ниже.'; return res; }
  } else {
    sets = [{ cards: parsePlain(t, current.type, res.errors) }];
  }

  for (const set of sets) {
    const named = set.task != null || set.title;
    let target = named ? findModule(set.task, set.title) : current;
    let newTitle = '';
    if (!target) {
      if (set.title) newTitle = String(set.title).trim();
      else {
        target = current;
        res.warnings.push(`Задание «${set.task}» не найдено, карточки попадут в «${moduleName(current)}».`);
      }
    }
    const cards = [];
    for (const raw of setCards(set)) {
      const r = normalizeCard(raw);
      if (r.card) cards.push(r.card); else res.errors.push(r.error);
    }
    if (cards.length) {
      res.groups.push({ module: target, newTitle, exam: set.exam || current.exam, type: set.type === 'accent' || set.type === 'quiz' ? set.type : (cards.every(c => c.word) ? 'accent' : 'quiz'), cards });
      res.valid += cards.length;
    }
  }
  return res;
}

/* ---------- Хранилище ---------- */
let storageOk = true;
let state = { modules: [] };
let admin = false;
let seedVersion = null;

function readSeed() {
  try { return JSON.parse(document.getElementById('seed-data').textContent); }
  catch (e) { return null; }
}

// Встроенные слова живут в самой странице, поэтому в память браузера пишутся только добавленные вручную.
function save() {
  const modules = state.modules.map(m => ({ ...m, cards: m.cards.filter(c => !c.seed) }));
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ modules }));
    storageOk = true;
    return true;
  } catch (e) {
    storageOk = false;
    return false;
  }
}

function createModule(title, type, exam) {
  const mod = { id: 'm' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36), exam: exam || 'ege', title, type, desc: '', cards: [] };
  state.modules.push(mod);
  return mod;
}

function addCards(mod, cards, fromSeed) {
  const seen = new Set(mod.cards.map(cardKey));
  let added = 0, dupes = 0;
  for (const card of cards) {
    const key = cardKey(card);
    if (seen.has(key)) { dupes++; continue; }
    seen.add(key);
    mod.cards.push(fromSeed ? { ...card, seed: true } : card);
    added++;
  }
  return { added, dupes };
}

function applySeed() {
  const seed = readSeed();
  if (!seed || !Array.isArray(seed.sets)) return;
  seedVersion = seed.seedVersion;
  for (const set of seed.sets) {
    let mod = set.section ? state.modules.find(m => m.id === String(set.task)) : findModule(set.task, set.title);
    if (!mod) mod = createModule(String(set.title || set.task), set.type === 'accent' ? 'accent' : 'quiz', set.exam);
    if (set.section) Object.assign(mod, { id: String(set.task), title: set.title, desc: set.desc || '', exam: set.exam, section: set.section, partDescs: set.partDescs || {}, groupDescs: set.groupDescs || {} });
    if (mod.clearedSeed === seedVersion) continue;
    const cards = setCards(set).map(normalizeCard).filter(r => r.card).map(r => r.card);
    addCards(mod, cards, true);
  }
}

function loadState() {
  let saved = null;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    saved = raw ? JSON.parse(raw) : null;
  } catch (e) {
    saved = null;
  }
  const modules = saved && Array.isArray(saved.modules) ? saved.modules : [];
  const merged = BUILTIN.map(b => {
    const old = modules.find(m => m.id === b.id) || {};
    return { ...b, cards: old.cards || [], clearedSeed: old.clearedSeed };
  });
  state = { modules: merged.concat(modules.filter(m => !BUILTIN.some(b => b.id === m.id))) };
  applySeed();
  try { admin = localStorage.getItem(ADMIN_KEY) === '1'; } catch (e) { admin = false; }
}

function setAdmin(on) {
  admin = on;
  try {
    if (on) localStorage.setItem(ADMIN_KEY, '1'); else localStorage.removeItem(ADMIN_KEY);
  } catch (e) { /* режим останется только до закрытия страницы */ }
}

const moduleName = m => (m.num ? `Задание ${m.num}. ${m.title}` : m.title);

function exportData() {
  return {
    sets: state.modules.filter(m => m.cards.length).map(m => ({
      task: m.num || m.id,
      title: m.title,
      type: m.type,
      exam: m.exam,
      cards: m.cards.map(({ seed, ...card }) => card)
    }))
  };
}

/* ---------- Окна ---------- */
function openModal(content) {
  modal.replaceChildren(content);
  if (!modal.open) modal.showModal();
}
function closeModal() {
  document.body.append(toastEl);
  if (modal.open) modal.close();
}
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
modal.addEventListener('close', () => document.body.append(toastEl));

function confirmDialog({ title, text, okText, onOk }) {
  openModal(h('div', { class: 'dlg' },
    h('h2', { id: 'modal-title', text: title }),
    h('p', { class: 'dlg-sub', text }),
    h('div', { class: 'dlg-actions' },
      h('button', { class: 'btn', type: 'button', text: 'Отмена', onclick: closeModal }),
      h('button', { class: 'btn danger', type: 'button', text: okText, onclick: () => { closeModal(); onOk(); } })
    )
  ));
}

function openImport(mod) {
  const isAccent = mod.type === 'accent';
  const area = h('textarea', {
    id: 'import-text',
    placeholder: isAccent ? 'звонИт, тОрты, договОр' : 'Купил ___ в бассейн. | абонемент | абонент',
    spellcheck: 'false',
    'aria-label': 'Слова для импорта'
  });
  const preview = h('div', { class: 'preview', 'aria-live': 'polite' });
  const modeAdd = h('input', { type: 'radio', name: 'import-mode', id: 'mode-add', value: 'add', checked: true });
  const modeReplace = h('input', { type: 'radio', name: 'import-mode', id: 'mode-replace', value: 'replace' });
  const submit = h('button', { class: 'btn primary', type: 'submit', disabled: true, text: 'Импортировать' });
  let parsed = null;

  function refresh() {
    parsed = parseImport(area.value, mod);
    const rows = [];
    if (parsed.fatal) rows.push(h('div', { class: 'err', text: parsed.fatal }));
    for (const g of parsed.groups) {
      const where = g.module ? moduleName(g.module) : `новая категория «${g.newTitle}»`;
      rows.push(h('div', { class: 'good', text: `${where}: ${cardsWord(g.cards.length)}` }));
    }
    parsed.warnings.forEach(w => rows.push(h('div', { class: 'warn', text: w })));
    parsed.errors.slice(0, 6).forEach(e => rows.push(h('div', { class: 'err', text: e })));
    if (parsed.errors.length > 6) rows.push(h('div', { class: 'err', text: `И ещё ошибок: ${parsed.errors.length - 6}` }));
    preview.replaceChildren(...rows);
    submit.disabled = parsed.valid === 0;
    const verb = modeReplace.checked ? 'Заменить на' : 'Добавить';
    submit.textContent = parsed.valid ? `${verb} ${cardsWord(parsed.valid)}` : 'Импортировать';
  }

  function run(e) {
    e.preventDefault();
    if (!parsed || !parsed.valid) return;
    let added = 0, dupes = 0;
    for (const g of parsed.groups) {
      const target = g.module || findModule(null, g.newTitle) || createModule(g.newTitle, g.type, g.exam);
      if (modeReplace.checked) { target.cards = []; target.clearedSeed = seedVersion; }
      const r = addCards(target, g.cards, false);
      added += r.added; dupes += r.dupes;
    }
    const saved = save();
    closeModal();
    route();
    const dupeText = dupes ? `, повторов пропущено: ${dupes}` : '';
    toast(saved ? `Добавлено: ${cardsWord(added)}${dupeText}` : 'Браузер не сохранил слова. Они пропадут после закрытия страницы.');
  }

  area.addEventListener('input', refresh);
  modeAdd.addEventListener('change', refresh);
  modeReplace.addEventListener('change', refresh);

  openModal(h('form', { class: 'dlg', onsubmit: run },
    h('div', {},
      h('h2', { id: 'modal-title', text: 'Добавить слова: ' + moduleName(mod) }),
      h('p', { class: 'dlg-sub', text: `Сейчас в наборе: ${cardsWord(mod.cards.length)}. Слова сохранятся только в этом браузере.` })
    ),
    h('div', { class: 'field' }, area),
    preview,
    h('fieldset', { class: 'seg' },
      h('label', {}, modeAdd, h('span', { text: 'Добавить к существующим' })),
      h('label', {}, modeReplace, h('span', { text: 'Заменить полностью' }))
    ),
    h('details', {},
      h('summary', { text: 'Какие форматы подходят' }),
      h('pre', { text: isAccent
        ? 'Текст, ударная гласная заглавная:\nзвонИт, тОрты, договОр\n\nJSON:\n{"task":"4","cards":[{"word":"звонИт"},{"word":"тОрты"}]}'
        : 'Текст, одна карточка в строке, верный ответ первым:\nвопрос | верный | неверный # пояснение\n\nJSON:\n{"task":"5","cards":[{"q":"Купил ___ в бассейн.","options":["абонемент","абонент"],"answer":"абонемент","hint":"пояснение"}]}'
      })
    ),
    h('div', { class: 'dlg-actions' },
      h('button', { class: 'btn', type: 'button', text: 'Отмена', onclick: closeModal }),
      submit
    )
  ));
  area.focus();
}

function openExport() {
  const json = JSON.stringify(exportData());
  const area = h('textarea', { id: 'export-text', readonly: true, 'aria-label': 'Все слова в формате JSON' });
  area.value = json;
  const standalone = window.self === window.top;

  async function copy() {
    try {
      await navigator.clipboard.writeText(json);
      toast('JSON скопирован');
    } catch (e) {
      area.focus();
      area.select();
      toast('Текст выделен, скопируйте его вручную');
    }
  }

  function downloadSite() {
    const doc = document.documentElement.cloneNode(true);
    doc.querySelector('#app').replaceChildren();
    const dlg = doc.querySelector('#modal');

    const seed = { seedVersion: new Date().toISOString(), sets: exportData().sets };

    const blob = new Blob(['<!doctype html>\n' + doc.outerHTML], { type: 'text/html;charset=utf-8' });
    const link = h('a', { href: URL.createObjectURL(blob), download: 'index.html' });
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 2000);
    toast('Файл index.html со всеми словами скачан');

// Части задания в порядке появления: «Глаголы», «А–Б» и так далее.
function partsOf(mod) {
  const parts = new Map();
  for (const c of mod.cards) {
    const name = c.part || 'Другое';
    const p = parts.get(name) || { name, count: 0, group: c.group || '' };
    p.count++;
    parts.set(name, p);
  }
  return [...parts.values()];
}

const selections = {};

function renderTask(mod) {
  const parts = partsOf(mod);
  const sel = selections[mod.id] || (selections[mod.id] = new Set());
  const groups = [];
  parts.forEach((p, i) => {
    let g = groups.find(x => x.name === p.group);
    if (!g) groups.push(g = { name: p.group, items: [] });
    g.items.push(i);
  });
  const total = items => items.reduce((n, i) => n + parts[i].count, 0);
  const startBtn = h('button', { class: 'btn primary', type: 'button', id: 'start-sel' });

  function refresh() {
    startBtn.disabled = !sel.size;
    startBtn.textContent = sel.size ? `Начать: ${cardsWord(total([...sel]))}` : 'Отметьте разделы галочками';
    app.querySelectorAll('[data-part]').forEach(cb => { cb.checked = sel.has(Number(cb.dataset.part)); });
    app.querySelectorAll('[data-group]').forEach(cb => {
      const items = groups[Number(cb.dataset.group)].items;
      const k = items.filter(i => sel.has(i)).length;
      cb.checked = k === items.length;
      cb.indeterminate = k > 0 && k < items.length;

  const descOf = name => (mod.partDescs || {})[name];
  const partRow = i => h('label', { class: 'part pick', for: 'part-' + i },

    h('span', { class: 'part-name' },

      h('small', { class: 'part-count', text: cardsWord(parts[i].count) }),
      descOf(parts[i].name) && h('small', { class: 'part-desc', text: descOf(parts[i].name) })
    )
  );
  const groupBlock = (g, gi) => (g.name
    ? h('section', { class: 'pgroup' },
        h('label', { class: 'pgroup-head', for: 'group-' + gi },
          h('input', { type: 'checkbox', id: 'group-' + gi, 'data-group': String(gi), onchange: e => { g.items.forEach(i => { if (e.target.checked) sel.add(i); else sel.delete(i); }); refresh(); } }),
          h('span', { class: 'part-name' },
            h('span', { class: 'pgroup-title', text: g.name }),
            h('small', { class: 'part-count', text: cardsWord(total(g.items)) }),

    h('header', { class: 'page-head' },

    ),

      h('span', { text: 'Все карточки' }),
