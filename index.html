<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>нарешка</title>
<meta name="description" content="Карточки для подготовки к ЕГЭ и ОГЭ по русскому языку: ударения, паронимы, лексические нормы.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2743c4">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="нарешка">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: одна узкая колонка «тетрадного листа»; на главной плитки в две колонки, в тренажёре одна карточка по центру. */
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --surface-2: #eaeef7;
  --fg: #182036;
  --muted: #5b6580;
  --line: #d9dfec;
  --accent: #2743c4;
  --accent-hover: #1e36a3;
  --accent-soft: #e4e9fb;
  --on-accent: #ffffff;
  --ok: #12804f;
  --ok-soft: #dcf3e7;
  --bad: #c62f33;
  --bad-soft: #fbe3e3;
  --shadow: 0 1px 2px rgba(24, 32, 54, .06), 0 8px 24px rgba(24, 32, 54, .06);
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151f; --surface: #1a202e; --surface-2: #252c3d; --fg: #eaeef7; --muted: #a0aac2;
    --line: #313a50; --accent: #8ea2ff; --accent-hover: #a9b9ff; --accent-soft: #252f55; --on-accent: #11151f;
    --ok: #4fd08f; --ok-soft: #173a2b; --bad: #ff8a8a; --bad-soft: #452024;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151f; --surface: #1a202e; --surface-2: #252c3d; --fg: #eaeef7; --muted: #a0aac2;
  --line: #313a50; --accent: #8ea2ff; --accent-hover: #a9b9ff; --accent-soft: #252f55; --on-accent: #11151f;
  --ok: #4fd08f; --ok-soft: #173a2b; --bad: #ff8a8a; --bad-soft: #452024;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
#app { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
button, textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Кнопки */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 8px 16px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--fg);
  font-weight: 600; font-size: 15px; line-height: 1.2; cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); font-weight: 500; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
@media (hover: hover) {
  .btn:not(:disabled):hover { background: var(--surface-2); }
  .btn.primary:not(:disabled):hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.danger:not(:disabled):hover { background: var(--bad); opacity: .9; }
  .btn.quiet:not(:disabled):hover { color: var(--fg); background: var(--surface-2); }
}

/* Главная */
.masthead { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 6vw, 40px); line-height: 1.15; letter-spacing: -.01em; }
.brand span { color: var(--accent); }
.lede { color: var(--muted); max-width: 60ch; }
.banner { padding: 12px 14px; border-radius: 10px; background: var(--bad-soft); color: var(--fg); font-size: 15px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.tile {
  display: flex; flex-direction: column; gap: 14px; min-width: 0;
  padding: 18px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius);
}
.tile-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chip {
  display: inline-block; padding: 3px 9px; border-radius: 6px;
  background: var(--accent-soft); color: var(--accent);
  font-size: 13px; font-weight: 600; white-space: nowrap;
}
.count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile h2 { font-size: 21px; line-height: 1.25; font-weight: 700; overflow-wrap: anywhere; }
.tile-desc { color: var(--muted); font-size: 15px; margin-top: 2px; }
.tile-body { flex: 1; }
.tile-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile-actions .primary { grid-column: 1 / -1; }
.tile-actions .wide { grid-column: 1 / -1; }

.tile.add {
  border-style: dashed; background: transparent; justify-content: center;
  align-items: flex-start;
}
.home-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 14px; }

/* Выбор экзамена и частей */
.plaques { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.plaque {
  display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: clamp(20px, 5vw, 32px);
  text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  transition: border-color .12s, background .12s;
}
.plaque-name { font-family: var(--font-display); font-weight: 700; font-size: clamp(36px, 9vw, 56px); line-height: 1.1; color: var(--accent); }
.plaque-sub { font-weight: 600; }
.plaque-name.sm { font-size: clamp(24px, 6vw, 34px); }
.plaque-name, .plaque-sub { overflow-wrap: anywhere; }
.plaques.one { grid-template-columns: minmax(0, 1fr); }
.plaque-count { color: var(--muted); font-size: 14px; }
@media (hover: hover) { .plaque:hover, .part:hover { border-color: var(--accent); background: var(--accent-soft); } }
.page-head { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.page-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 5vw, 32px); line-height: 1.2; overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 18px; border: 1px dashed var(--line); border-radius: var(--radius); }
.parts { display: flex; flex-direction: column; gap: 8px; max-width: 680px; }
.part {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; padding: 10px 16px;
  text-align: left; font-weight: 600; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  transition: border-color .12s, background .12s;
}
.part.all { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.part.all .count { color: inherit; }
.part-name { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.part-desc { font-weight: 400; font-size: 13px; line-height: 1.35; color: var(--muted); }
.pgroups { display: flex; flex-direction: column; gap: 22px; max-width: 680px; }
.pgroup { display: flex; flex-direction: column; gap: 8px; }
.pgroup-head { display: flex; align-items: center; gap: 12px; padding: 4px 2px; cursor: pointer; }
.pgroup-title { font-weight: 700; font-size: 18px; }
.parts.sub { padding-left: 10px; border-left: 2px solid var(--line); }
.part.pick { justify-content: flex-start; align-items: flex-start; gap: 12px; padding-block: 12px; }
.pgroup-head { align-items: flex-start; }
.part-count { font-size: 13px; font-weight: 600; color: var(--accent); }
.start-bar .btn:disabled { display: none; }
.part.pick .count, .pgroup-head .count { margin-left: auto; padding-left: 8px; }
.part input, .pgroup-head input { flex: none; width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); }
.part.all { max-width: 680px; }
.pick-hint { color: var(--muted); font-size: 14px; max-width: 680px; }
.start-bar { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 680px; display: flex; }
.start-bar .btn { flex: 1; min-height: 52px; box-shadow: var(--shadow); }
@media (hover: hover) { .part.all:hover { background: var(--accent-hover); border-color: var(--accent-hover); } }

/* Тренажёр */
.study { max-width: 680px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.study-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.study-title { font-weight: 600; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.progress-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width .25s ease; }

.card {
  display: flex; flex-direction: column; gap: 18px;
  padding: clamp(18px, 4vw, 32px);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.card-label { font-size: 14px; color: var(--muted); font-weight: 500; }
.prompt { font-size: clamp(20px, 4.4vw, 26px); line-height: 1.35; font-weight: 600; overflow-wrap: anywhere; }
.prompt.word { font-size: clamp(24px, 7vw, 44px); line-height: 1.15; font-weight: 700; }
.prompt.word.long { font-size: clamp(20px, 5.6vw, 36px); }
.note { color: var(--muted); font-size: 15px; margin-top: 4px; }
.def { font-size: 16px; margin: 6px 0 10px; padding: 10px 12px; background: var(--accent-soft); border-radius: 10px; overflow-wrap: anywhere; }
.options { display: grid; gap: 10px; grid-template-columns: 1fr; }
.options.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.option {
  display: flex; align-items: center; gap: 10px; min-height: 54px; width: 100%; min-width: 0;
  padding: 10px 14px; text-align: left;
  background: var(--surface); border: 2px solid var(--line); border-radius: 12px;
  font-size: 18px; font-weight: 500; cursor: pointer; overflow-wrap: anywhere;
  transition: background .12s, border-color .12s;
}
.option .key { flex: none; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; width: 1.1em; }
.option .txt { flex: 1; min-width: 0; }
.option .mark { flex: none; font-weight: 700; }
.option:disabled { cursor: default; color: inherit; }
.option.correct { background: var(--ok-soft); border-color: var(--ok); }
.option.correct .mark { color: var(--ok); }
.option.wrong { background: var(--bad-soft); border-color: var(--bad); }
.option.wrong .mark { color: var(--bad); }
.option.faded { opacity: .55; }
.option.picked { border-color: var(--accent); background: var(--accent-soft); }
.option.missed { border-style: dashed; }
#check { align-self: stretch; }
@media (hover: hover) { .option:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); } }
.stress { color: var(--accent); font-weight: 700; }

.feedback { display: flex; flex-direction: column; gap: 12px; }
.verdict { font-weight: 600; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.hint { color: var(--muted); font-size: 15px; }
.explain { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.ex-word { display: flex; flex-direction: column; gap: 3px; font-size: 15px; overflow-wrap: anywhere; }
.ex-title { font-weight: 700; font-size: 16px; }
.ex-word.hit .ex-title { color: var(--ok); }
.ex-mean { color: var(--muted); }
.ex-use { color: var(--fg); }
.ex-use b { font-weight: 700; }

/* Результаты */
.score { font-family: var(--font-display); font-weight: 700; font-size: clamp(44px, 12vw, 64px); line-height: 1.05; font-variant-numeric: tabular-nums; }
.score.done { color: var(--ok); }
.result-sub { color: var(--muted); }
.mistakes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.mistakes li { padding: 9px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; font-size: 15px; overflow-wrap: anywhere; }
.mistakes .q { color: var(--muted); font-size: 14px; }
.mistakes .a { font-weight: 600; font-size: 16px; }
.result-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.result-actions .primary { flex: 1 1 220px; }

/* Окна */
dialog {
  width: min(600px, calc(100vw - 24px)); max-height: calc(100dvh - 24px);
  padding: 0; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); color: var(--fg); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(10, 14, 26, .5); }
.dlg { display: flex; flex-direction: column; gap: 14px; padding: 20px; }
.dlg h2 { font-size: 20px; line-height: 1.3; overflow-wrap: anywhere; }
.dlg-sub { color: var(--muted); font-size: 15px; }
.dlg-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 6px; font-weight: 500; font-size: 15px; }
textarea, input[type="text"] {
  width: 100%; padding: 10px 12px; font-size: 16px; font-weight: 400;
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
}
textarea { min-height: 170px; resize: vertical; line-height: 1.4; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 12px; border: 0; margin: 0; }
.seg legend { padding: 0; margin-bottom: 6px; font-weight: 500; font-size: 15px; }
.seg label { display: block; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 40px; height: 100%; padding: 6px 8px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg input:checked + span { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(24, 32, 54, .15); }
.seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 1px; }
.preview { font-size: 14px; display: flex; flex-direction: column; gap: 4px; min-height: 22px; overflow-wrap: anywhere; }
.preview .good { color: var(--ok); font-weight: 600; }
.preview .err { color: var(--bad); }
.preview .warn { color: var(--muted); }
details { font-size: 14px; color: var(--muted); }
summary { cursor: pointer; font-weight: 500; }
pre { margin: 8px 0 0; padding: 10px; background: var(--bg); border-radius: 8px; overflow-x: auto; font: 13px/1.45 ui-monospace, Consolas, monospace; color: var(--fg); }

.userbar { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 14px 16px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; font-size: 15px; }
.choice b { font-size: 17px; }
.choice span { color: var(--muted); }
@media (hover: hover) { .choice:hover { border-color: var(--accent); background: var(--accent-soft); } }
.nick-list { display: flex; flex-direction: column; gap: 6px; }
.nick { min-height: 44px; padding: 8px 14px; text-align: left; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 600; font-size: 16px; cursor: pointer; }
.nick[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.home-extras { display: contents; }
.home-cards { order: 3; }
.home-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; }
.hcard { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: 14px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.hcard b { font-size: 16px; color: var(--fg); }
.hcard.done { border-color: var(--ok); background: var(--ok-soft); }
.hcard.action { cursor: pointer; border: 2px solid var(--accent); }
@media (hover: hover) { .hcard.action:hover { background: var(--accent-soft); } }
.tile-prog { display: flex; align-items: center; gap: 10px; }
.tile-prog .progress { flex: 1; margin: 0; }
.badges { display: flex; flex-direction: column; gap: 6px; }
.badge { display: flex; gap: 12px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; opacity: .5; filter: grayscale(1); }
.badge.on { opacity: 1; filter: none; border-color: var(--accent); background: var(--accent-soft); }
.badge-icon { font-size: 26px; flex: none; width: 34px; text-align: center; }
.badge-text { display: flex; flex-direction: column; font-size: 14px; }
.badge-text small { color: var(--muted); font-size: 13px; }
.ach-title { margin: 6px 0 0; font-size: 17px; }
.ach-progress { display: flex; flex-direction: column; gap: 6px; }
.ach-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px 44px; gap: 8px; align-items: center; font-size: 14px; }
.ach-row .progress { margin: 0; }
.who-badges { margin-left: 6px; font-size: 15px; letter-spacing: 2px; }
.who-badges.big { margin: 0; font-size: 24px; }
.stat-row { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { display: flex; flex-direction: column; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 110px; }
.stat b { font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.day-cells { display: flex; flex-wrap: wrap; gap: 4px; }
.day-cell { width: 16px; height: 16px; border-radius: 4px; background: var(--surface-2); }
.day-cell.lvl1 { background: color-mix(in srgb, var(--ok) 35%, var(--surface-2)); }
.day-cell.lvl2 { background: color-mix(in srgb, var(--ok) 65%, var(--surface-2)); }
.day-cell.lvl3 { background: var(--ok); }
.tbl tr.bad-row td { background: var(--bad-soft); }
.help-item { display: flex; flex-direction: column; gap: 3px; font-size: 15px; }
.help-item span { color: var(--muted); }
.field-note { font-weight: 400; font-size: 13px; color: var(--muted); }
.privacy { font-size: 14px; color: var(--muted); padding: 10px 12px; background: var(--surface-2); border-radius: 10px; }
.form-err { color: var(--bad); font-size: 14px; min-height: 1em; }
.big-code { font-family: var(--font-display); font-size: clamp(30px, 9vw, 42px); font-weight: 700; letter-spacing: .04em; color: var(--accent); text-align: center; font-variant-numeric: tabular-nums; }
select { width: 100%; min-height: 44px; padding: 8px 12px; font-size: 16px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 12px; max-width: 680px; }
.tab { flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; }
.tab.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(24, 32, 54, .15); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
.rating { list-style: none; margin: 0; padding: 0; max-width: 680px; display: flex; flex-direction: column; gap: 6px; }
.rating li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.rating li.mine { border-color: var(--accent); background: var(--accent-soft); }
.rating .place { width: 2em; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.rating .who { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.rating .pts { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
.teacher-login { max-width: 420px; }
.teacher-sec { display: flex; flex-direction: column; gap: 10px; }
.teacher-sec h2 { font-size: 20px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .mono { font-variant-numeric: tabular-nums; white-space: nowrap; }

.userbar { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 14px 16px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; font-size: 15px; }
.choice b { font-size: 17px; }
.choice span { color: var(--muted); }
@media (hover: hover) { .choice:hover { border-color: var(--accent); background: var(--accent-soft); } }
.nick-list { display: flex; flex-direction: column; gap: 6px; }
.nick { min-height: 44px; padding: 8px 14px; text-align: left; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 600; font-size: 16px; cursor: pointer; }
.nick[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.privacy { font-size: 14px; color: var(--muted); padding: 10px 12px; background: var(--surface-2); border-radius: 10px; }
.form-err { color: var(--bad); font-size: 14px; min-height: 1em; }
.big-code { font-family: var(--font-display); font-size: clamp(30px, 9vw, 42px); font-weight: 700; letter-spacing: .04em; color: var(--accent); text-align: center; font-variant-numeric: tabular-nums; }
select { width: 100%; min-height: 44px; padding: 8px 12px; font-size: 16px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 12px; max-width: 680px; }
.tab { flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; }
.tab.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(24, 32, 54, .15); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
.rating { list-style: none; margin: 0; padding: 0; max-width: 680px; display: flex; flex-direction: column; gap: 6px; }
.rating li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.rating li.mine { border-color: var(--accent); background: var(--accent-soft); }
.rating .place { width: 2em; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.rating .who { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.rating .pts { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
.teacher-login { max-width: 420px; }
.teacher-sec { display: flex; flex-direction: column; gap: 10px; }
.teacher-sec h2 { font-size: 20px; }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100vw - 32px); width: max-content;
  padding: 10px 16px; border-radius: 10px;
  background: var(--fg); color: var(--bg); font-weight: 500; font-size: 15px;
  box-shadow: var(--shadow); z-index: 50;
}
@media (max-width: 420px) {
  .plaques { gap: 10px; }
  .options.two { grid-template-columns: 1fr; }
  .tile-actions { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

значения слова"],"answer":"от суффикса -а- после корня","hint":"Зависит от суффикса -а- после корня. Есть -а-: пишем И: выбИрать, собИрать. Нет -а-: пишем Е: выбЕру, собЕрёт. Исключение: побирушка.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"ДЕР / ДИР: от чего зависит написание?","options":["от суффикса -а- после корня","от ударения","от последней согласной корня","от значения слова"],"answer":"от суффикса -а- после корня","hint":"Зависит от суффикса -а- после корня. Есть -а-: пишем И: выдИрать, раздИрать. Нет -а-: пишем Е: выдЕру, раздЕрёт. Исключение: выдирки.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"МЕР / МИР: от чего зависит написание?","options":["от суффикса -а- после корня","от ударения","от последней согласной корня","от значения слова"],"answer":"от суффикса -а- после корня","hint":"Зависит от суффикса -а- после корня. Есть -а-: пишем И: замИрать, умИрать. Нет -а-: пишем Е: замЕреть, умЕреть. Не путать: примерять (мера) и примирять (мир) — это другие корни, их проверяют ударением.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"ПЕР / ПИР: от чего зависит написание?","options":["от суффикса -а- после корня","от ударения","от последней согласной корня","от значения слова"],"answer":"от суффикса -а- после корня","hint":"Зависит от суффикса -а- после корня. Есть -а-: пишем И: запИрать, опИраться. Нет -а-: пишем Е: запЕреть, опЕреться.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"ТЕР / ТИР: от чего зависит написание?","options":["от суффикса -а- после корня","от ударения","от последней согласной корня","от значения слова"],"answer":"от суффикса -а- после корня","hint":"Зависит от суффикса -а- после корня. Есть -а-: пишем И: вытИрать, стИрать. Нет -а-: пишем Е: вытЕреть, стЕреть.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"БЛЕСТ / БЛИСТ: от чего зависит написание?","options":["от суффикса -а- после корня","от ударения","от последних согласных корня","от значения слова"],"answer":"от суффикса -а- после корня","hint":"Зависит от суффикса -а- после корня. Есть -а-: пишем И: блИстать, блИстательный. Нет -а-: пишем Е: блЕстеть, блЕстящий.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"ЖЕГ / ЖИГ: от чего зависит написание?","options":["от суффикса -а- после корня","от ударения","от последней согласной корня","от значения слова"],"answer":"от суффикса -а- после корня","hint":"Зависит от суффикса -а- после корня. Есть -а-: пишем И: зажИгать, выжИгать. Нет -а-: пишем Е: зажЕчь, выжЕгший. Исключения: отжиг, обжиг, розжиг.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"СТЕЛ / СТИЛ: от чего зависит написание?","options":["от суффикса -а- после корня","от ударения","от последней согласной корня","от значения слова"],"answer":"от суффикса -а- после корня","hint":"Зависит от суффикса -а- после корня. Есть -а-: пишем И: застИлать, расстИлать. Нет -а-: пишем Е: застЕлить, постЕлить. Исключение: выстилка.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"ЧЕТ / ЧИТ: от чего зависит написание?","options":["от суффикса -а- после корня","от ударения","от последней согласной корня","от значения слова"],"answer":"от суффикса -а- после корня","hint":"Зависит от суффикса -а- после корня. Есть -а-: пишем И: вычИтать, учИтывать. Нет -а-: пишем Е: вычЕсть. Исключения: сочетать, сочетание, словосочетание, чета.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"А(Я) / ИМ (ИН): от чего зависит написание?","options":["от суффикса -а- после корня","от ударения","от последней согласной корня","от значения слова"],"answer":"от суффикса -а- после корня","hint":"Зависит от суффикса -а- после корня. Есть -а-: пишем ИМ или ИН: понИМать, начИНать, снИМать. Нет -а-: пишем А или Я: понЯть, начАть, снЯть.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"РАВН / РОВН: от чего зависит написание?","options":["от значения слова","от ударения","от суффикса -а- после корня","от последней согласной корня"],"answer":"от значения слова","hint":"Зависит от значения. «Равный, одинаковый»: пишем А: срАвнить, урАвнение, рАвнобедренный. «Ровный, гладкий, прямой»: пишем О: вырОвнять дорогу, подрОвнять чёлку. Исключения: равнина (А), ровесник, уровень, поровну (О).","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"МАК / МОК: от чего зависит написание?","options":["от значения слова","от ударения","от суффикса -а- после корня","от последней согласной корня"],"answer":"от значения слова","hint":"Зависит от значения. «Окунать в жидкость»: пишем А: мАкать, обмАкнуть перо в чернила. «Пропускать влагу, становиться мокрым»: пишем О: промОкнуть, непромОкаемый, промОкашка. Корень МОЧ всегда с О: мочить, промочить.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Обычная безударная гласная в корне: от чего зависит написание?","options":["от ударной гласной в однокоренном слове","от суффикса -а- после корня","от значения слова","ни от чего, нужно запомнить"],"answer":"от ударной гласной в однокоренном слове","hint":"Подбираем однокоренное слово или форму, где гласная под ударением: вОда — вОды, лЕсной — лЕс. Нельзя проверять глаголами на -ыва-, -ива-: опоздать проверяем словом «поздний», а не «опаздывать».","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Непроверяемая (словарная) гласная: от чего зависит написание?","options":["ни от чего: слово нужно запомнить","от ударения","от суффикса -а- после корня","от последней согласной"],"answer":"ни от чего: слово нужно запомнить","hint":"Проверочного слова нет: кОрова, сОбака, вИнегрет. Такие слова запоминаем или смотрим в орфографическом словаре.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Парная согласная в корне (б/п, д/т, з/с): от чего зависит написание?","options":["от проверочного слова, где после согласной гласная или Л, М, Н, Р","от ударения","от следующей глухой согласной","ни от чего"],"answer":"от проверочного слова, где после согласной гласная или Л, М, Н, Р","hint":"Меняем слово так, чтобы после согласной стояла гласная: дуБ — дуБы, сказКа — сказать, лоЖка — ложечка.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Непроизносимая согласная (солнце, честный): от чего зависит написание?","options":["от проверочного слова, где этот звук слышен","от ударения","от значения слова","её пишут всегда"],"answer":"от проверочного слова, где этот звук слышен","hint":"Солнце — солнышко, честный — честь, сердце — сердечный. Если проверки нет, согласной нет: вкусный (вкус), опасный (опасен). Запомнить: чувство, лестница.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Ё или О после шипящей под ударением в корне: от чего зависит написание?","options":["есть ли однокоренное слово с Е","от ударения","от суффикса после корня","всегда Ё"],"answer":"есть ли однокоренное слово с Е","hint":"Если можно подобрать слово с Е, пишем Ё: жЁлтый — желтеть, чЁрный — чернеть. Если нельзя, пишем О: шОрох, крыжОвник, трущОба. Корень ЖЕЧЬ: в существительных О (ожог, поджог), в глаголах Ё (обжёг, поджёг).","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"И или Ы после Ц в корне: от чего зависит написание?","options":["правило: всегда И, кроме нескольких исключений","от ударения","от следующей согласной"],"answer":"правило: всегда И, кроме нескольких исключений","hint":"В корне после Ц пишем И: цИрк, цИфра, цИтата. Исключения: цыган, цыплёнок, на цыпочках, цыц и их родственные слова.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"В каких корнях буква зависит от ударения?","options":["ГАР / ГОР","ЗАР / ЗОР","КЛАН / ила":"Карточки о самих правилах: от чего зависит написание и в каких случаях пишется та или иная буква.","Запоминаем исключения":"Слова, которые пишутся не по правилу или которые нужно просто запомнить.","Отрабатываем правила на словах":"Слова с пропусками: применяйте правило. После ответа — объяснение для конкретного слова."}},{"task":"o2","title":"Приставки","desc":"Неизменяемые приставки, З/С на конце, ПРЕ/ПРИ, Ы/И после приставок, Ъ и Ь","exam":"oge","section":"orf","type":"quiz","cards":[{"kind":"rule","part":"От чего зависит написание","q":"Приставки БЕЗ/БЕС, ВОЗ/ВОС, ИЗ/ИС, РАЗ/РАС, ВЗ/ВС, НИЗ/НИС, ЧРЕЗ/ЧЕРЕС: от чего зависит написание?","options":["от следующей согласной: звонкая или глухая","от ударения","от значения приставки","ни от чего, приставка не меняется"],"answer":"от следующей согласной: звонкая или глухая","hint":"Перед звонкой согласной и гласной пишем З: безвкусный, разбить, изучить. Перед глухой пишем С: бесполезный, расписать, исправить. Запомнить: чересчур, рассчитать, расчёт.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Приставки С-, О-, ОТ-, ПОД-, НАД-, ПРЕД-, ОБ-: от чего зависит написание?","options":["ни от чего: они не меняются","от следующей согласной","от ударения","от значения"],"answer":"ни от чего: они не меняются","hint":"Эти приставки пишутся всегда одинаково: сделать, сбить, отдать, подписать, надкусить, предсказать. Приставки З- не существует: в словах здание, здоровье, здесь З входит в корень.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Приставки РАЗ/РОЗ (РАС/РОС): от чего зависит написание гласной?","options":["от ударения","от следующей согласной","от значения"],"answer":"от ударения","hint":"Под ударением пишем О: рОзыск, рОспись, рОзыгрыш. Без ударения пишем А: рАзыскать, рАсписаться, рАзыграть.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Приставки ПРЕ- и ПРИ-: от чего зависит написание?","options":["от значения приставки","от ударения","от следующей согласной","ни от чего"],"answer":"от значения приставки","hint":"ПРИ-: приближение (приехать), присоединение (пришить), близость (пришкольный), неполнота действия (приоткрыть), действие в своих интересах (припрятать). ПРЕ-: «очень» (премудрый) или «пере-» (преградить = перегородить). Есть слова, которые нужно запомнить: привилегия, приоритет, пренебрегать, президент.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Приставка ПРА-: от чего зависит написание?","options":["от значения «древний» или родства","от ударения","от следующей согласной"],"answer":"от значения «древний» или родства","hint":"ПРА- пишем, если значение «первоначальный, древний» или степень родства: прабабушка, прародина, праязык. В остальных случаях ПРО-: прочитать, прообраз.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Ы или И после приставки: от чего зависит написание?","options":["от того, какая приставка","от ударения","от значения слова","ни от чего"],"answer":"от того, какая приставка","hint":"После русских приставок на согласную пишем Ы: разыграть, подытожить, безыдейный. После МЕЖ-, СВЕРХ- и иноязычных приставок (ДЕЗ-, ПОСТ-, СУПЕР-, КОНТР-) остаётся И: межигровой, дезинформация. После приставки на гласную тоже И: поиграть. Исключение: взимать.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Разделительные Ъ и Ь: от чего зависит выбор?","options":["от места: после приставки или внутри слова","от ударения","от следующей согласной"],"answer":"от места: после приставки или внутри слова","hint":"Ъ пишем после приставки на согласную перед е, ё, ю, я: подъезд, объявить, съёжиться; а также в словах с ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- (двухъярусный) и после иноязычных приставок (адъютант, инъекция). Ь пишем внутри слова перед е, ё, ю, я, и: вьюга, семья, воробьи; и перед О в заимствованных словах: бульон. Перед а, о, у, э после приставки знак не нужен: сэкономить.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"В каких случаях пишется разделительный Ъ?","options":["после приставки на согласную перед е, ё, ю, я","после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- перед е, ё, ю, я","после иноязычной приставки перед е, ё, ю, я","внутри корня перед е, ё, ю, я","после приставки перед а, о, у, э","в сложносокращённых словах"],"answer":"после приставки на согласную перед е, ё, ю, я","answers":["после приставки на согласную перед е, ё, ю, я","после ДВУХ-, ТРЁХ-, ЧЕТЫРЁХ- перед е, ё, ю, я","после иноязычной приставки перед е, ё, ю, я"],"hint":"Ъ пишем после приставки, а не внутри корня, и только перед е, ё, ю, я.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"В каких случаях пишется разделительный Ь?","options":["внутри корня перед е, ё, ю, я, и","перед О в заимствованных словах","после приставки на согласную","после приставки перед э","после ДВУХ-"],"answer":"внутри корня перед е, ё, ю, я, и","answers":["внутри корня перед е, ё, ю, я, и","перед О в заимствованных словах"],"hint":"Ь пишем внутри слова, после приставки — Ъ.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"В каких случаях разделительный знак не нужен?","options":["после приставки перед а, о, у, э","в сложносокращённых словах","после приставки перед е, ё, ю, я","внутри корня перед и"],"answer":"после приставки перед а, о, у, э","answers":["после приставки перед а, о, у, э","в сложносокращённых словах"],"hint":"Перед а, о, у, э и в сложносокращённых словах знак не пишем.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Когда на конце приставки пишется З?","options":["перед звонкой согласной","перед гласной","перед глухой согласной","в приставке С-"],"answer":"перед звонкой согласной","answers":["перед звонкой согласной","перед гласной"],"hint":"Перед звонкой и гласной — З, перед глухой — С. Приставка С- не меняется.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Когда на конце приставки пишется С?","options":["перед глухой согласной","в неизменяемой приставке С-","перед звонкой согласной","перед гласной"],"answer":"перед глухой согласной","answers":["перед глухой согласной","в неизменяемой приставке С-"],"hint":"Перед глухой — С. Приставка С- всегда с С.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Какие приставки не меняются?","options":["С-","ОТ-","ПОД-","НАД-","ПРЕД-","БЕЗ- / БЕС-","РАЗ- / РАС-","ИЗ- / ИС-"],"answer":"С-","answers":["С-","ОТ-","ПОД-","НАД-","ПРЕД-"],"hint":"Неизменяемые приставки пишутся всегда одинаково. Приставки на З/С меняются.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"В каких значениях пишется ПРИ-?","options":["приближение","присоединение","близость","неполнота действия","действие в своих интересах","«очень»","«пере-»"],"answer":"приближение","answers":["приближение","присоединение","близость","неполнота действия","действие в своих интересах"],"hint":"ПРИ-: приближение, присоединение, близость, неполнота, в своих интересах, доведение до конца. ПРЕ-: «очень» и «пере-».","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"В каких значениях пишется ПРЕ-?","options":["«очень»","близко к «пере-»","приближение","неполнота действия","близость"],"answer":"«очень»","answers":["«очень»","близко к «пере-»"],"hint":"ПРЕ- = очень или пере-.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Когда после приставки пишется Ы вместо И?","options":["после русской приставки на согласную","после МЕЖ- и СВЕРХ-","после иноязычной приставки","после приставки на гласную"],"answer":"после русской приставки на согласную","answers":["после русской приставки на согласную"],"hint":"Ы пишется только после русских приставок на согласную. Исключение: взимать.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Когда после приставки сохраняется И?","options":["после МЕЖ- и СВЕРХ-","после иноязычной приставки","после приставки на гласную","в слове «взимать»","после русской приставки на согласную","в слове «подытожить»"],"answer":"после МЕЖ- и СВЕРХ-","answers":["после МЕЖ- и СВЕРХ-","после иноязычной приставки","после приставки на гласную","в слове «взимать»"],"hint":"И сохраняется после МЕЖ-, СВЕРХ-, иноязычных приставок и приставок на гласную.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Когда в приставках РАЗ- / РОЗ- (РАС- / РОС-) пишется О?","options":["под ударением","без ударения","перед глухой согласной"],"answer":"под ударением","answers":["под ударением"],"hint":"Под ударением РОЗ-, РОС-, без ударения РАЗ-, РАС-.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Когда пишется приставка ПРА-?","options":["степень родства","«древний, изначальный»","«поддерживающий»","движение"],"answer":"степень родства","answers":["степень родства","«древний, изначальный»"],"hint":"ПРА- — родство и древность; в остальных случаях ПРО-.","group":"Заучиваем правила"},{"kind":"pick","part":"Исключения и слова на запоминание","q":"«Находиться в Москве» — какое слово?","options":["пребывать","прибывать"],"answer":"пребывать","hint":"Пребывать = находиться (ПРЕ-); прибывать = приезжать (ПРИ-: приближение).","group":"Запоминаем исключения"},{"kind":"pick","part":"Исключения и слова на запоминание","q":"«Изменить другу» — какое слово?","options":["предать","придать"],"answer":"предать","hint":"Предать = изменить; придать = добавить (придать значение).","group":"Запоминаем исключения"},{"kind":"pick","part":"Исключения и слова на запоминание","q":"«Временный успех» — какое слово?","options":["преходящий","приходящ  приставки":"БЕЗ/БЕС, РАЗ/РАС, ИЗ/ИС и другие: смотрите на первую букву корня.","Неизменяемые приставки и РАЗ/РОЗ":"Приставки С-, ОТ-, ПОД-, НАД-, ПРЕД- не меняются; в РАЗ/РОЗ смотрим на ударение.","ПРЕ или ПРИ по значению":"Определите значение приставки: близость, присоединение, неполнота → ПРИ; «очень» или «пере-» → ПРЕ.","Ы или И после приставки":"После русской приставки на согласную — Ы; после МЕЖ-, СВЕРХ-, иноязычных приставок и приставок на гласную — И.","Разделительные Ъ и Ь":"Ъ — после приставки перед е, ё, ю, я; Ь — внутри слова; перед а, о, у, э после приставки знак не нужен.","ПРЕ / ПРИ: трудные слова":"Сложные и словарные слова с ПРЕ / ПРИ. После ответа — значение приставки или пометка «запомнить»."},"groupDescs":{"Заучиваем правила":"Карточки о самих правилах: от чего зависит написание и в каких случаях пишется та или иная буква.","Запоминаем исключения":"Слова, которые пишутся не по правилу или которые нужно просто запомнить.","Отрабатываем правила на словах":"Слова с пропусками: применяйте правило. После ответа — объяснение для конкретного слова."}},{"task":"o3","title":"Суффиксы","desc":"Суффиксы существительных, прилагательных, наречий и глаголов","exam":"oge","section":"orf","type":"quiz","cards":[{"kind":"rule","part":"От чего зависит написание","q":"Суффиксы -ЕК- и -ИК-: от чего зависит выбор?","options":["выпадает ли гласная при склонении","от ударения","от рода слова","от последней согласной"],"answer":"выпадает ли гласная при склонении","hint":"Если при склонении гласная выпадает, пишем -ЕК-: замочек — замочка. Если не выпадает, пишем -ИК-: ключик — ключика. Суффиксы -ЧИК- и -НИК- не меняются: диванчик, напарник.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Суффиксы -ЕЦ- и -ИЦ-: от чего зависит выбор?","options":["от рода существительного","от ударения","выпадает ли гласная"],"answer":"от рода существительного","hint":"Мужской род: -ЕЦ- (братец, молодец). Женский род: -ИЦ- (сестрица, умница). Средний род: -ЕЦ-, если ударение после суффикса (письмецо), и -ИЦ-, если до суффикса (платьице).","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Суффиксы -ЧИК- и -ЩИК-: от чего зависит выбор?","options":["от согласной перед суффиксом","от ударения","от рода слова"],"answer":"от согласной перед суффиксом","hint":"После Д, Т, З, С, Ж пишем -ЧИК-: переводчик, лётчик, грузчик (запоминалка: ЗоСя ЖДёТ). После остальных согласных пишем -ЩИК-: банщик, каменщик. После Л пишем Ь: кровельщик, стекольщик.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Суффиксы -ИНК- и -ЕНК-: от чего зависит выбор?","options":["от слова, от которого образовано существительное","от ударения","от рода слова"],"answer":"от слова, от которого образовано существительное","hint":"Если слово образовано от существительного на -ИНА, пишем -ИНК-: горошина — горошинка. В остальных случаях -ЕНК-: башня — башенка, песня — песенка. Исключение: горлинка.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Суффиксы -ИЧК- и -ЕЧК-: от чего зависит выбор?","options":["есть ли в исходном слове суффикс -ИЦ-","от ударения","от рода слова"],"answer":"есть ли в исходном слове суффикс -ИЦ-","hint":"От слов с -ИЦ- пишем -ИЧК-: сестрица — сестричка, лестница — лестничка. В остальных случаях -ЕЧК-: Таня — Танечка, время — времечко.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Суффиксы -ОНЬК- и -ЕНЬК- в существительных: от чего зависит выбор?","options":["от согласной перед суффиксом","от ударения","от рода слова"],"answer":"от согласной перед суффиксом","hint":"После твёрдой согласной -ОНЬК-: лисонька, берёзонька. После мягкой, шипящей и гласной -ЕНЬК-: доченька, Катенька, Зоенька. Исключения: заинька, паинька, баиньки.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Суффиксы -ИВ- и -ЕВ- в прилагательных: от чего зависит выбор?","options":["от ударения","от рода слова","от последней согласной корня"],"answer":"от ударения","hint":"Под ударением -ИВ-: красИвый, правдИвый. Без ударения -ЕВ-: фасолЕвый, эмалЕвый. Исключения: милостивый, юродивый.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Суффиксы -К- и -СК- в прилагательных: от чего зависит выбор?","options":["от основы слова и от наличия краткой формы","от ударения","от рода слова"],"answer":"от основы слова и от наличия краткой формы","hint":"-К- пишем у прилагательных с краткой формой (резкий — резок) и от слов на к, ч, ц (рыбак — рыбацкий, немец — немецкий). В остальных случаях -СК-: французский, деревенский. Исключения: узбекский, таджикский.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Суффиксы -ЧИВ- и -ЛИВ-: от чего зависит написание?","options":["ни от чего: всегда пишется И","от ударения","от рода"],"answer":"ни от чего: всегда пишется И","hint":"Суффиксы не меняются: доверчивый, заботливый, терпеливый.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"О или Е после шипящих и Ц в суффиксах: от чего зависит выбор?","options":["от ударения","от рода слова","от части речи"],"answer":"от ударения","hint":"Под ударением пишем О: крючОк, ежОвый, девчОнка. Без ударения Е: глянцЕвый, плюшЕвый. В отглагольных словах и суффиксе -ЁР пишем Ё: ночЁвка, дирижЁр.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Гласная на конце наречия с приставкой (досуха, вправо): от чего зависит выбор?","options":["от приставки","от ударения","от суффикса прилагательного"],"answer":"от приставки","hint":"Приставки ИЗ-, ДО-, С- → на конце А: изредкА, досухА, справА. Приставки В-, НА-, ЗА- → на конце О: вправО, налевО, зановО. Запоминалка: до окнА — досухА, за окнО — зановО.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Суффиксы -ОВА- (-ЕВА-) и -ЫВА- (-ИВА-) в глаголах: от чего зависит выбор?","options":["от формы 1-го лица","от ударения","от вида глагола"],"answer":"от формы 1-го лица","hint":"Если в 1-м лице -УЮ, -ЮЮ, пишем -ОВА-, -ЕВА-: командую — командовать, ночую — ночевать. Если -ЫВАЮ, -ИВАЮ, пишем -ЫВА-, -ИВА-: заканчиваю — заканчивать. Если -ВА- ударный, смотрим глагол без него: преодолевать — преодолеть. Исключения: затмевать, продлевать, застревать.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"-ЕТЬ или -ИТЬ в глаголах с ОБЕЗ- / ОБЕС-: от чего зависит выбор?","options":["переходный глагол или нет","от ударения","от вида глагола"],"answer":"переходный глагол или нет","hint":"Если действие ни на кого не направлено (сам), пишем Е: солдат обессилел. Если есть кого? что?, пишем И: болезнь обессилила солдата.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"После каких согласных пишется суффикс -ЧИК-?","options":["после Д","после Т","после З","после С","после Ж","после Н","после Р","после Л"],"answer":"после Д","answers":["после Д","после Т","после З","после С","после Ж"],"hint":"После Д, Т, З, С, Ж — -ЧИК- (запоминалка «ЗоСя ЖДёТ»). После остальных — -ЩИК-.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Когда в существительном пишется суффикс -ЕК-?","options":["если гласная выпадает при склонении","если гласная не выпадает","всегда под ударением"],"answer":"если гласная выпадает при склонении","answers":["если гласная выпадает при склонении"],"hint":"-ЕК- — гласная выпадает, -ИК- — сохраняется.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Когда пишется суффикс -ЕЦ-?","options":["в мужском роде","в среднем роде, если ударение после суффикса","в женском роде","в среднем роде, если ударение до суффикса"],"answer":"в мужском роде","answers":["в мужском роде","в среднем роде, если ударение после суффикса"],"hint":"-ЕЦ-: мужской род и средний с ударением после. -ИЦ иваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Ударное личное окончание (льют, спят): от чего зависит написание?","options":["от того, что слышим","от спряжения по инфинитиву","от вида глагола"],"answer":"от того, что слышим","hint":"Если окончание под ударением, пишем как слышим, правило спряжения не нужно: льЮт (хотя «лить» на -ить), спЯт.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Глагол с приставкой ВЫ- (выпрос..т): как определить окончание?","options":["отбросить ВЫ- и поставить ударение заново","считать окончание ударным","всегда писать Е"],"answer":"отбросить ВЫ- и поставить ударение заново","hint":"ВЫ- всегда забирает ударение. Без неё: просит — окончание безударное, «просить» на -ить, II спряжение: выпросит. А вылетит: летИт — окончание ударное.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Суффикс действительного причастия настоящего времени (-ущ-/-ющ- или -ащ-/-ящ-): от чего зависит выбор?","options":["от спряжения глагола","от ударения","от рода причастия"],"answer":"от спряжения глагола","hint":"От глаголов I спряжения: -ущ-/-ющ- (читающий, колющий). От глаголов II спряжения: -ащ-/-ящ- (строящий, клеящий, держащий). Исключение: брезжущий.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Суффикс страдательного причастия настоящего времени (-ем- или -им-): от чего зависит выбор?","options":["от спряжения глагола","от ударения","от вида глагола"],"answer":"от спряжения глагола","hint":"От глаголов I спряжения: -ем-/-ом- (исследуемый, ведомый). От глаголов II спряжения: -им- (видимый, значимый). Исключение: движимый.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Гласная перед -Л- и -ВШ- (обидел, затеявший): от чего зависит написание?","options":["от гласной в инфинитиве","от спряжения","от ударения"],"answer":"от гласной в инфинитиве","hint":"В прошедшем времени правило спряжения ете, -ут/-ют (цЕлУЮ).","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Какие буквы пишутся в окончаниях глаголов II спряжения?","options":["И","А","Я","Е","У","Ю"],"answer":"И","answers":["И","А","Я"],"hint":"II спряжение: -ишь, -ит, -им, -ите, -ат/-ят (мИлАЯ).","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Когда правило о спряжении НЕ применяется?","options":["окончание под ударением","прошедшее время","повелительное наклонение","окончание без ударения","причастие настоящего времени"],"answer":"окончание под ударением","answers":["окончание под ударением","прошедшее время","повелительное наклонение"],"hint":"Если окончание ударное — пишем как слышим. В прошедшем времени гласная как в инфинитиве. В повелительном наклонении всегда И.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Какие суффиксы у причастий от глаголов I спряжения?","options":["-УЩ-","-ЮЩ-","-ЕМ-","-АЩ-","-ЯЩ-","-ИМ-"],"answer":"-УЩ-","answers":["-УЩ-","-ЮЩ-","-ЕМ-"],"hint":"I спряжение: -ущ-/-ющ- (читающий), -ем- (уважаемый).","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Какие суффиксы у причастий от глаголов II спряжения?","options":["-АЩ-","-ЯЩ-","-ИМ-","-УЩ-","-ЮЩ-","-ЕМ-"],"answer":"-АЩ-","answers":["-АЩ-","-ЯЩ-","-ИМ-"],"hint":"II спряжение: -ащ-/-ящ- (строящий), -им- (видимый).","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Какие глаголы разноспрягаемые?","options":["хотеть","бежать","держать","брить","гнать"],"answer":"хотеть","answers":["хотеть","бежать"],"hint":"Хотеть и бежать имеют окончания обоих спряжений.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Что пишется перед -НН- в причастиях?","options":["-анн- / -янн- от глаголов на -ать, -ять","-енн- от глаголов на -ить, -еть"," orf","type":"quiz","cards":[{"kind":"rule","part":"От чего зависит написание","q":"Н или НН в прилагательном от существительного (клюквенный, лебединый): от чего зависит?","options":["от суффикса","от ударения","от вида глагола","от зависимых слов"],"answer":"от суффикса","hint":"-ОНН-, -ЕНН- и корень на Н + суффикс -Н- → НН: традиционный, клюквенный, длинный. -ИН-, -АН-, -ЯН- → Н: лебединый, кожаный, глиняный. Исключения: ветреный (Н); стеклянный, оловянный, деревянный (НН).","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Н или НН в полном слове от глагола (крашеный, покрашенный): от чего зависит?","options":["есть ли признаки причастия","от ударения","от суффикса прилагательного","ни от чего"],"answer":"есть ли признаки причастия","hint":"НН, если есть хотя бы один признак: приставка (кроме НЕ-) — покрашенный; зависимое слово — крашенный вчера; совершенный вид — решённый; суффикс -ова-/-ева- — маринованный. Если признаков нет — Н: жареный картофель. Исключения: раненый, кованый, жёваный (Н); нечаянный, невиданный, медленный (НН).","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Н или НН в краткой форме (решена, рассеянна): от чего зависит?","options":["краткое причастие это или краткое прилагательное","от ударения","от приставки"],"answer":"краткое причастие это или краткое прилагательное","hint":"Краткое причастие (что сделано?) всегда с одной Н: задача решена, тетради проверены. Краткое прилагательное (каков?) — столько Н, сколько в полной форме: она рассеянна (рассеянная), лицо встревоженно.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Н или НН в наречии на -О (организованно, ветрено): от чего зависит?","options":["от слова, от которого образовано наречие","от ударения","всегда НН"],"answer":"от слова, от которого образовано наречие","hint":"Пишем столько Н, сколько в исходном слове: организованный → организованно, ветреный → ветрено.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Н или НН в существительном (воспитанник, гостиная): от чего зависит?","options":["от слова, от которого образовано существительное","всегда НН","от ударения"],"answer":"от слова, от которого образовано существительное","hint":"Воспитанный → воспитанник, мороженый → мороженое. Запомнить с одной Н: труженик, мученик, гостиная, гостиница, приданое.","group":"Заучиваем правила"},{"kind":"rule","part":"От чего зависит написание","q":"Влияет ли приставка НЕ- на количество Н (некрашеный)?","options":["нет, НЕ- не считается приставкой-признаком","да, с НЕ- всегда НН"],"answer":"нет, НЕ- не считается приставкой-признаком","hint":"Некрашеный забор — одна Н. Но если есть ещё приставка или зависимое слово — НН: непрочитанная книга, некрашенный вовремя пол.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Какие признаки причастия требуют НН?","options":["есть приставка, кроме НЕ-","есть зависимое слово","совершенный вид","суффикс -ова- / -ева-","приставка НЕ-","несовершенный вид без приставки","суффикс -ин-"],"answer":"есть приставка, кроме НЕ-","answers":["есть приставка, кроме НЕ-","есть зависимое слово","совершенный вид","суффикс -ова- / -ева-"],"hint":"Хватает одного признака: приставка, зависимое слово, совершенный вид, -ова-/-ева-.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Когда в прилагательном от существительного пишется НН?","options":["суффикс -ОНН-","суффикс -ЕНН-","корень на Н + суффикс -Н-","суффикс -ИН-","суффикс -АН-","суффикс -ЯН-"],"answer":"суффикс -ОНН-","answers":["суффикс -ОНН-","суффикс -ЕНН-","корень на Н + суффикс -Н-"],"hint":"НН: -онн-, -енн-, н+н. Н: -ин-, -ан-, -ян-.","group":"Заучиваем правила"},{"kind":"multi","part":"В каких случаях пишется: частные случаи","q":"Когда пишется одна Н?","options":["суффиксы -ИН-, -АН-, -ЯН-","краткое причастие","отглагольное прилагательное б
